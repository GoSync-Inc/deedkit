name: deedkit-gateway
services:
  gateway:
    image: deedkit-gateway:${DEEDKIT_VERSION:-0.1.0}
    build:
      context: ..
      dockerfile: services/gateway/Dockerfile
    env_file: ./private/gateway.env
    command: ["--policy", "/run/deedkit/policy/policy.json", "--public-url", "${DEEDKIT_PUBLIC_URL:?Set gateway HTTPS origin}", "--host", "0.0.0.0", "--port", "13240"]
    volumes:
      # The policy directory, never the file: a rename beside the live file reaches the
      # running gateway (a single-file bind pins the old inode; ANYM-424).
      - ./private/gateway-policy:/run/deedkit/policy:ro
      - ./private/gateway-keys:/run/deedkit/keys:ro
    ports: ["127.0.0.1:13240:13240"]
    networks: [integration]
    restart: unless-stopped
    # Liveness only: unauthenticated /healthz with the exact public Host the
    # boundary requires, no proxy and no output. Port matches --port above.
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - |
          import sys, urllib.parse, urllib.request
          try:
              host = urllib.parse.urlsplit(sys.argv[1]).netloc
              request = urllib.request.Request(f"http://127.0.0.1:{int(sys.argv[2])}/healthz", headers={"Host": host})
              with urllib.request.build_opener(urllib.request.ProxyHandler({})).open(request, timeout=8) as response:
                  healthy = response.status == 200
          except Exception:
              healthy = False
          sys.exit(0 if healthy else 1)
        - "${DEEDKIT_PUBLIC_URL:?Set gateway HTTPS origin}"
        - "13240"
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    read_only: true
    user: "10001:10001"
    cpu_shares: 512
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    tmpfs: ["/tmp:size=16m,noexec,nosuid"]
    mem_limit: 256m
    pids_limit: 64
    stop_grace_period: 15s
    logging:
      driver: json-file
      options: {max-size: 5m, max-file: "2"}
networks:
  integration:
    external: true
    name: ${DEEDKIT_NETWORK:-deedkit-integration}
