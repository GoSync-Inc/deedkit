# ANYM-937: the session holder of whatsapp2. Use after compose.yaml + compose.whatsapp.yaml + compose.whatsapp-native.yaml,
# and only from this account's cutover on (docs/whatsapp-native.md, Session holder cutover): one overlay per account,
# so each account cuts over and rolls back alone; without it whatsapp2 runs child mode unchanged. The holder owns the
# session directory, the canonical host lock bind, its `session_holder` login and the provider connection; the
# collector attaches over the private socket directory (0700, UID 10001) and mounts neither the session nor the lock
# directory. Both read the same
# whatsapp2.json, which names `holder_socket_directory` and `holder_dsn_file`. The holder reads registered files and
# uploads (send_file) at the paths the command worker names, read-only.
services:
  whatsapp2-holder:
    profiles: [whatsapp]
    restart: unless-stopped
    depends_on:
      db: {condition: service_healthy}
    networks: [backend, collector_egress]
    read_only: true
    # SQLite's own temporary files (sorts, temporary tables; modernc sqlite searches /var/tmp, /usr/tmp, /tmp) need a
    # writable /tmp in the scratch image, as the collector's child mode had; every other write is under /spool,
    # /sessions or /run/deedkit/holder (docs/whatsapp-native.md, Where the holder writes).
    tmpfs: ["/tmp:size=256m,noexec,nosuid"]
    user: "10001:10001"
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: ${PROBE_WHATSAPP_HOLDER_MEMORY:-512m}
    cpu_shares: ${PROBE_WHATSAPP_HOLDER_CPU_SHARES:-1024}
    pids_limit: 64
    # ANYM-914: above the 15 s disconnect bound; the holder releases its claim after the provider disconnect.
    stop_grace_period: 25s
    logging:
      driver: json-file
      options: {max-size: 5m, max-file: "2"}
    image: anymsg-whatsapp-holder:${MESSAGING_VERSION:-0.9.19}
    volumes:
      - ./private/whatsapp2.json:/run/secrets/whatsapp_config:ro
      - ./private/whatsapp2-holder.dsn:/run/secrets/holder_dsn:ro
      - ./private/whatsapp2-session:/sessions
      - ./private/session-locks:/run/deedkit/session-locks
      - ./private/whatsapp2-holder:/run/deedkit/holder
      - whatsapp2_spool:/spool
      - files:/data:ro
      - file_uploads:/data/files/.uploads:ro
  # The collector attaches: the events spool and the socket directory, no session and no session-locks bind.
  whatsapp2:
    volumes: !override
      - ./private/collector.dsn:/run/secrets/database_url:ro
      - ./private/whatsapp2.json:/run/secrets/whatsapp_config:ro
      - ./private/whatsapp2.permit.json:/run/secrets/whatsapp_permit:ro
      - ./private/whatsapp2-holder:/run/deedkit/holder
      - whatsapp2_spool:/spool
      - files:/data
      - file_uploads:/data/files/.uploads:ro
