# Merge with compose.yaml. Explicit profile + private enabled/permit gates required.
services:
  telegram:
    image: anymsg-api:${MESSAGING_VERSION:-0.9.9}
    labels: {org.anymsg.collector: "true"}
    profiles: [collectors]
    command: [python, -m, messaging_service.telegram_collector, --config, /run/secrets/telegram_config]
    init: true
    restart: unless-stopped
    # ANYM-914: above the 15 s disconnect bound, so a host shutdown ends in a clean claim release.
    stop_grace_period: 25s
    depends_on:
      db: {condition: service_healthy}
    environment:
      DATABASE_URL_FILE: /run/secrets/database_url
      PROBE_FILES: /data/files
      # ANYM-919: list_birthdays dates in the owner's zone (the api's line, compose.yaml); empty means UTC.
      ANYMSG_OWNER_TIMEZONE: ${ANYMSG_OWNER_TIMEZONE:-}
    volumes:
      - ./private/collector.dsn:/run/secrets/database_url:ro
      - ./private/telegram.json:/run/secrets/telegram_config:ro
      - ./private/telegram.credentials.json:/run/secrets/telegram_credentials:ro
      - ./private/telegram.permit.json:/run/secrets/telegram_permit:ro
      - ./private/telegram-session:/sessions
      # ANYM-914: the canonical host lock directory, one per host, shared by every session opener.
      - ./private/session-locks:/run/deedkit/session-locks
      - collector_spool:/spool
      - files:/data
      - file_uploads:/data/files/.uploads:ro
    networks: [backend, collector_egress]
    read_only: true
    user: "10001:10001"
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    tmpfs: ["/tmp:size=32m,noexec,nosuid"]
    mem_limit: ${PROBE_TELEGRAM_MEMORY:-768m}
    cpu_shares: ${PROBE_TELEGRAM_CPU_SHARES:-512}
    pids_limit: 64
    logging:
      driver: json-file
      options: {max-size: 5m, max-file: "2"}
volumes:
  collector_spool: {}
networks:
  collector_egress: {}
