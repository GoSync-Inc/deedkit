name: anymsg
services:
  db:
    image: ${POSTGRES_IMAGE:-postgres:18-bookworm@sha256:afc7e2d441324c0388fa80c3d24f733b4194a4eb7f47dd8ee2b08eb1a24a647c}
    env_file: ./private/postgres.env
    restart: unless-stopped
    volumes:
      - database:/var/lib/postgresql
    networks: [backend]
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U probe_owner -d messaging_probe"]
      interval: 5s
      timeout: 3s
      retries: 12
    mem_limit: ${PROBE_DB_MEMORY:-2g}
    cpu_shares: ${PROBE_DB_CPU_SHARES:-2048}
    logging:
      driver: json-file
      options: {max-size: 5m, max-file: "2"}
  api:
    image: anymsg-api:${MESSAGING_VERSION:-0.9.9}
    build:
      context: ..
      target: runtime
      args:
        PYTHON_IMAGE: ${PYTHON_IMAGE:-python:3.13-slim-bookworm@sha256:a1165e272e578941b84abc79e4ab38a0305cd12803a5c4247979ac7655f4d641}
    restart: unless-stopped
    depends_on:
      db: {condition: service_healthy}
    environment:
      DATABASE_URL_FILE: /run/secrets/database_url
      PROBE_PUBLIC_URL: ${PROBE_PUBLIC_URL:?Set the HTTPS base URL}
      PROBE_ALLOWED_HOSTS: ${PROBE_ALLOWED_HOSTS:?Set exact allowed Host values}
      PROBE_FILES: /data/files
      PROBE_BIND: 0.0.0.0
      PROBE_PORT: "8080"
      # ANYM-282: the zone that dates named in queued messages resolve in; empty means UTC.
      ANYMSG_OWNER_TIMEZONE: ${ANYMSG_OWNER_TIMEZONE:-}
    volumes:
      - ./private/app.dsn:/run/secrets/database_url:ro
      - files:/data:ro
      - file_uploads:/data/files/.uploads
    ports:
      - "127.0.0.1:18940:8080"
    # Liveness only: unauthenticated /healthz with an allowed Host (no database
    # write, proxy, credentials or output), from the same PROBE_* settings.
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - |
          import os, sys, urllib.request
          try:
              bind = os.environ.get("PROBE_BIND", "127.0.0.1")
              address = "127.0.0.1" if bind in ("", "0.0.0.0", "::") else f"[{bind}]" if ":" in bind else bind
              port = int(os.environ.get("PROBE_PORT", "18940"))
              host = os.environ.get("PROBE_ALLOWED_HOSTS", "127.0.0.1:18940,localhost:18940").split(",")[0]
              request = urllib.request.Request(f"http://{address}:{port}/healthz", headers={"Host": host})
              with urllib.request.build_opener(urllib.request.ProxyHandler({})).open(request, timeout=8) as response:
                  healthy = response.status == 200
          except Exception:
              healthy = False
          sys.exit(0 if healthy else 1)
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      backend: {}
      frontend:
        aliases: [anymsg-api]
    read_only: true
    user: "10001:10001"
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    tmpfs: ["/tmp:size=32m,noexec,nosuid"]
    mem_limit: ${PROBE_API_MEMORY:-768m}
    cpu_shares: ${PROBE_API_CPU_SHARES:-2048}
    pids_limit: 96
    logging:
      driver: json-file
      options: {max-size: 5m, max-file: "2"}
volumes:
  database: {}
  files: {}
  file_uploads: {}
networks:
  backend:
    internal: true
  frontend: {}
