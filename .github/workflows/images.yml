name: Container verification
on:
  workflow_call:
    inputs:
      source_ref:
        type: string
        default: ''
permissions:
  contents: read
jobs:
  changes:
    # A pull request whose merge commit changes no image input skips the builds, and a
    # merge queue run never builds: the pull request built any changed input and the main
    # push builds every target before publication (process v2 P6). The calling job still
    # succeeds. Every other event, and any doubt, builds all targets.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      build: ${{ steps.decide.outputs.build }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        if: ${{ github.event_name == 'pull_request' }}
        with:
          persist-credentials: false
          fetch-depth: 2
      - name: Decide whether the image targets must be built
        id: decide
        env:
          EVENT_NAME: ${{ github.event_name }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          # Path prefixes copied into the images.yml targets (tests/test_tiden_ci.py
          # checks them against scripts/production.py BUILDS and the Dockerfiles), plus
          # the build driver, the publication script the build jobs run and the workflows.
          IMAGE_INPUTS: |
            .dockerignore
            Dockerfile
            LICENSE
            THIRD_PARTY_NOTICES.md
            licenses/
            packages/platform-contracts/
            services/calendar/
            services/calls/
            services/gateway/
            services/messaging/
            whatsapp/
            scripts/production.py
            scripts/publish_images.py
            scripts/scan_image.py
            .gitleaks-images.toml
            tests/fixtures/gitleaks-canary/
            .github/workflows/ci.yml
            .github/workflows/images.yml
        run: |
          build=true reason="$EVENT_NAME runs always build"
          if [ "$EVENT_NAME" = merge_group ]; then
            build=false reason='merge queue runs never build; the main push builds every target before publication'
          elif [ "$EVENT_NAME" = pull_request ]; then
            reason='the pull request merge commit could not be established'
            # Only GitHub's two-parent merge of this exact head yields the pull request's diff.
            if [ "$(git rev-parse HEAD^@ | wc -l | tr -d ' ')" = 2 ] && [ "$(git rev-parse HEAD^2)" = "$HEAD_SHA" ]; then
              # NUL-separated names are never quoted, so non-ASCII or quoted paths still match.
              changed="$(mktemp)"
              git diff -z --name-only --no-renames HEAD^1 HEAD > "$changed"
              build=false reason='no image input changed'
              while IFS= read -r -d '' path; do
                while IFS= read -r input; do
                  if [ -n "$path" ] && [ -n "$input" ] && [[ "$path" == "$input"* ]]; then
                    build=true reason="image input changed: $path"
                    break 2
                  fi
                done <<< "$IMAGE_INPUTS"
              done < "$changed"
            fi
          fi
          echo "build=$build" >> "$GITHUB_OUTPUT"
          echo "Image build: $build ($reason)" >> "$GITHUB_STEP_SUMMARY"
  build:
    needs: changes
    if: ${{ needs.changes.outputs.build == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        target: [runtime, indexer, enricher-local, whatsapp-native, gateway, calendar, calls, backup]
    services:
      # A throwaway registry for the publication dry run; it holds nothing after the job. Like the
      # pinned base images check-image already pulls, it comes from Docker Hub by digest.
      registry:
        image: registry:3@sha256:ddf754342cfc8acc51a56d5d0ab6af06826461864460636d8bd5c546dab2a7b8
        ports: ['127.0.0.1:5000:5000']
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
          ref: ${{ inputs.source_ref }}
      # ANYM-441: the forked whatsmeow pin must equal upstream + fork.patch before an image compiles it.
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: '1.26.9'
          cache: false
      - name: Check the whatsmeow fork against upstream and fork.patch
        run: python3 scripts/check_whatsmeow_fork.py
      - name: Build and smoke-test the production target without providers
        env:
          TARGET: ${{ matrix.target }}
        run: python3 scripts/production.py check-image --target "$TARGET"
      # The publish job in ci.yml pushes exactly this archive; it never rebuilds (scripts/publish_images.py).
      - name: Export the tested image and publish it to a local registry as a dry run
        # Pull requests prove the publication path before merge; a main push exports what it
        # publishes. Merge queue runs and manual dispatches (whose baselines may predate
        # scripts/publish_images.py) publish nothing and skip it.
        if: ${{ github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref == 'refs/heads/main' && inputs.source_ref == '') }}
        env:
          TARGET: ${{ matrix.target }}
        run: |
          sha="$(git rev-parse HEAD)"
          python3 scripts/publish_images.py export --target "$TARGET" --sha "$sha" --directory "$RUNNER_TEMP/images/image-$TARGET"
          # First publication pushes; a repeated one finds the tag and does not push again.
          for expected in push attest; do
            python3 scripts/publish_images.py publish --local-dry-run --registry localhost:5000/dry-run \
              --target "$TARGET" --sha "$sha" --directory "$RUNNER_TEMP/images" > "$RUNNER_TEMP/dry-run.json"
            test "$(python3 -c 'import json, sys; print(json.load(open(sys.argv[1]))[0]["action"])' "$RUNNER_TEMP/dry-run.json")" = "$expected"
          done
      # Same pinned binary and checksum as security.yml (tests/test_scan_image.py keeps them equal).
      - name: Install the pinned gitleaks
        if: ${{ github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref == 'refs/heads/main' && inputs.source_ref == '') }}
        run: |
          curl --fail --silent --show-error --location --retry 3 -o "$RUNNER_TEMP/gitleaks.tar.gz" \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  $RUNNER_TEMP/gitleaks.tar.gz" | sha256sum --check --strict
          mkdir "$RUNNER_TEMP/gitleaks-bin"
          tar -xzf "$RUNNER_TEMP/gitleaks.tar.gz" -C "$RUNNER_TEMP/gitleaks-bin" gitleaks
          echo "GITLEAKS=$RUNNER_TEMP/gitleaks-bin/gitleaks" >> "$GITHUB_ENV"
      # Every layer is scanned on its own, so a file deleted or hidden by a later layer is still
      # found; a finding or a scanner problem fails the job before the archive can be kept.
      - name: Scan every layer and the config of the tested image for secrets
        if: ${{ github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref == 'refs/heads/main' && inputs.source_ref == '') }}
        env:
          TARGET: ${{ matrix.target }}
        run: |
          set -o pipefail
          python3 scripts/scan_image.py --canary
          python3 scripts/scan_image.py "$RUNNER_TEMP/images/image-$TARGET/image.tar" | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Keep the tested image for the publish job
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && inputs.source_ref == '' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: image-${{ matrix.target }}
          path: ${{ runner.temp }}/images/image-${{ matrix.target }}
          retention-days: 1
          overwrite: true
          if-no-files-found: error
