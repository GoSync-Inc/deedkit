          finish python-image docker pull "$DEEDKIT_TEST_PYTHON_IMAGE" </dev/null >/dev/null 2>&1 &
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
