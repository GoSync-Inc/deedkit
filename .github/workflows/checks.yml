name: Build and test
on:
  workflow_call:
    inputs:
      version:
        type: string
        default: ''
      source_ref:
        type: string
        default: ''
      tiden_branch:
        type: string
        default: ''
      reuse_queue_evidence:
        # Set only by ci.yml on a main push whose `reuse` job validated the merge queue's evidence of this commit
        # and uploaded it as `ci-evidence`: the test jobs are skipped and `tiden` publishes that evidence.
        type: boolean
        default: false
      reuse_pr_verification:
        # Set only by ci.yml on a merge queue run whose `pr_reuse` job validated a passing, full pull request run of
        # exactly this group commit's tree: the test jobs are skipped and `tiden` publishes nothing.
        type: boolean
        default: false
      reused_pr_run:
        # With reuse_pr_verification: the reused pull request run attempt's URL and the merge commit it tested,
        # named in this run's skipped Tiden receipt.
        type: string
        default: ''
      reused_pr_tested_sha:
        type: string
        default: ''
    outputs:
      source_sha:
        description: Exact commit these checks tested
        value: ${{ jobs.verify.outputs.source_sha }}
      docs_only:
        description: Whether the documentation job classified this pull request run as documentation-only
        value: ${{ jobs.documentation.outputs.docs_only }}
      docs_sha:
        description: The pull request merge commit the docs-only decision classified
        value: ${{ jobs.documentation.outputs.docs_sha }}
    secrets:
      TIDEN_API_TOKEN:
        required: false
permissions:
  contents: read
jobs:
  documentation:
    # A pull request run that changes only reviewed documentation nothing reads skips the test jobs (ANYM-323,
    # scripts/docs_only.py, .github/docs-only-paths.txt). Every other event, and any doubt, verifies in full.
    if: ${{ github.event_name == 'pull_request' && inputs.source_ref == '' && !inputs.reuse_queue_evidence }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      docs_only: ${{ steps.decide.outcome == 'success' && steps.decide.outputs.docs_only || 'false' }}
      docs_sha: ${{ steps.decide.outcome == 'success' && steps.decide.outputs.docs_sha || '' }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
          fetch-depth: 2
      - name: Decide whether this pull request changes only reviewed documentation
        id: decide
        # A failed decision runs the full suite, never a failed run.
        continue-on-error: true
        env:
          EVENT_NAME: ${{ github.event_name }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: python3 scripts/docs_only.py
  verify:
    needs: documentation
    if: ${{ !cancelled() && !inputs.reuse_queue_evidence && !inputs.reuse_pr_verification && needs.documentation.outputs.docs_only != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DEEDKIT_TEST_PYTHON_IMAGE: docker.io/library/python@sha256:a1165e272e578941b84abc79e4ab38a0305cd12803a5c4247979ac7655f4d641
    outputs:
      source_sha: ${{ steps.source.outputs.sha }}
    services:
      postgres:
        image: postgres:18-bookworm@sha256:afc7e2d441324c0388fa80c3d24f733b4194a4eb7f47dd8ee2b08eb1a24a647c
        env:
          POSTGRES_USER: probe_owner
          POSTGRES_PASSWORD: synthetic-ci-password
          POSTGRES_DB: messaging_probe_test
        ports: ['5432:5432']
        options: --health-cmd "pg_isready -U probe_owner -d messaging_probe_test" --health-interval 5s --health-timeout 3s --health-retries 12
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
          ref: ${{ inputs.source_ref }}
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
          path: ci-tools
      - name: Start evidence record
        id: source
        run: |
          mkdir -p "$RUNNER_TEMP/ci-evidence"
          git rev-parse HEAD > "$RUNNER_TEMP/ci-evidence/source-sha"
          echo "$GITHUB_RUN_ATTEMPT" > "$RUNNER_TEMP/ci-evidence/attempt"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Start the release router image build and the Python image pull in the background
        # Both overlap the module test steps; the Python/PostgreSQL step waits for them and fails on either.
        # Each job writes its own log and exit file and holds none of the step's streams, so the step ends at once.
        run: |
          mkdir -p "$RUNNER_TEMP/background"
          finish() { if "${@:2}" > "$RUNNER_TEMP/background/$1.log" 2>&1; then echo 0; else echo 1; fi > "$RUNNER_TEMP/background/$1.tmp"; mv "$RUNNER_TEMP/background/$1.tmp" "$RUNNER_TEMP/background/$1.exit"; }
          revision="$(git rev-parse HEAD)"
          finish router docker build --file services/release-router/Dockerfile --tag deedkit-release-router:ci \
            --build-arg "VERSION_REF=$revision" --label "org.opencontainers.image.revision=$revision" \
            --label org.opencontainers.image.source=https://github.com/GoSync-Inc/deedkit . </dev/null >/dev/null 2>&1 &
          finish python-image docker pull "$DEEDKIT_TEST_PYTHON_IMAGE" </dev/null >/dev/null 2>&1 &
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with: {python-version: '3.13'}
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with: {node-version: '24'}
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with: {version: '0.9.26'}
      - name: Native extraction tools
        run: sudo apt-get update && sudo apt-get install -y poppler-utils tesseract-ocr tesseract-ocr-eng tesseract-ocr-rus ffmpeg age libglib2.0-0 libsndfile1 libopus0
      - name: Install pinned dependencies
        run: uv sync --frozen --group dev
      - name: Build packages
        id: build
        run: |
          python - <<'PYCODE'
          import os,tomllib
          from pathlib import Path
          version=tomllib.loads(Path('services/messaging/pyproject.toml').read_text())['project']['version']
          with open(os.environ['GITHUB_OUTPUT'],'a') as output:output.write(f'version={version}\n')
          PYCODE
          uv build --project services/messaging --out-dir dist
          mkdir -p dist
          cd packages/npm
          npm pack --pack-destination ../../dist --ignore-scripts
      - name: Validate release inventory and metadata
        id: release
        env:
          EXPECTED_VERSION: ${{ inputs.version }}
        run: |
          if [ -n "$EXPECTED_VERSION" ]; then
            uv run python scripts/check_release.py "$EXPECTED_VERSION"
          else
            uv run python scripts/check_release.py
          fi
          uvx --from twine twine check dist/*.whl dist/*.tar.gz
      - name: Gateway isolated package and transport tests
        id: gateway
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        working-directory: services/gateway
        run: |
          uv sync --locked --group dev
          uv run pytest -q -o junit_family=xunit1 --junitxml="$RUNNER_TEMP/ci-evidence/gateway.xml"
          uv build --project ../../packages/platform-contracts --out-dir "$RUNNER_TEMP/gateway-dist"
          uv build --out-dir "$RUNNER_TEMP/gateway-dist"
          uv venv "$RUNNER_TEMP/gateway-installed" --python 3.13
          uv pip install --python "$RUNNER_TEMP/gateway-installed/bin/python" "$RUNNER_TEMP"/gateway-dist/*.whl
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/gateway-installed/bin/python" - <<'PY'
          import importlib.util
          from agent_gateway.catalog import CATALOG
          assert CATALOG
          for module in ('family_calendar', 'messaging_service', 'pipecat', 'telethon', 'psycopg'):
              assert importlib.util.find_spec(module) is None, module
          PY
          "$RUNNER_TEMP/gateway-installed/bin/deedkit-gateway" --help
      - name: Calendar provider policy and database tests
        id: calendar
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        working-directory: services/calendar
        env:
          FCS_TEST_DSN: postgresql://probe_owner:synthetic-ci-password@127.0.0.1:5432/messaging_probe_test
        run: |
          uv sync --locked --group dev
          uv run pytest -m 'not live' -o junit_family=xunit1 --junitxml="$RUNNER_TEMP/ci-evidence/calendar.xml"
          uv build --out-dir "$RUNNER_TEMP/calendar-dist"
      - name: Calls Python 3.13 native transports and synthetic workflows
        id: calls
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        working-directory: services/calls
        run: |
          uv sync --locked --group dev
          uv run pytest -q -o junit_family=xunit1 --junitxml="$RUNNER_TEMP/ci-evidence/calls.xml"
      - name: Calls frontend tests and build
        id: calls_frontend
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        working-directory: services/calls/frontend
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          node --test --test-reporter=junit tests/*.test.mjs > "$RUNNER_TEMP/ci-evidence/calls-frontend.xml"
          npm run build
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: '1.26.9'
          cache-dependency-path: whatsapp/whatsmeow/go.sum
      - name: Build native WhatsApp offline normalizer
        run: |
          cd whatsapp/whatsmeow
          go build -trimpath -o "$RUNNER_TEMP/anymsg-whatsmeow" .
          echo "ANYMSG_WHATSMEOW_TEST_BINARY=$RUNNER_TEMP/anymsg-whatsmeow" >> "$GITHUB_ENV"
      # tests/test_scan_image.py runs its real-scanner cases with the same pinned binary as
      # images.yml and security.yml (tests/test_scan_image.py keeps the three pins equal).
      - name: Install the pinned gitleaks for the image-scan tests
        run: |
          curl --fail --silent --show-error --location --retry 3 -o "$RUNNER_TEMP/gitleaks.tar.gz" \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  $RUNNER_TEMP/gitleaks.tar.gz" | sha256sum --check --strict
          mkdir "$RUNNER_TEMP/gitleaks-bin"
          tar -xzf "$RUNNER_TEMP/gitleaks.tar.gz" -C "$RUNNER_TEMP/gitleaks-bin" gitleaks
          echo "GITLEAKS=$RUNNER_TEMP/gitleaks-bin/gitleaks" >> "$GITHUB_ENV"
      - name: Wait for the background router image and Python image
        env:
          BACKGROUND_WAIT_SECONDS: 900
        run: |
          for name in router python-image; do
            for _ in $(seq "$BACKGROUND_WAIT_SECONDS"); do
              test -f "$RUNNER_TEMP/background/$name.exit" && break
              sleep 1
            done
            if [ "$(cat "$RUNNER_TEMP/background/$name.exit" 2>/dev/null)" != 0 ]; then
              cat "$RUNNER_TEMP/background/$name.log" 2>/dev/null || true
              echo "::error::background $name preparation failed or did not finish"
              exit 1
            fi
          done
      - name: Python/PostgreSQL tests
        # Shard 1 of the root suite; the `python` jobs run the others in parallel (scripts/python_shards.py).
        id: python
        env:
          PROBE_TEST_DSN_FILE: ${{ runner.temp }}/anymsg-test.dsn
          ANYMSG_TEST_POSTGRES_CONTAINER: ${{ job.services.postgres.id }}
          ANYMSG_TEST_WHEEL: ${{ github.workspace }}/dist/anymsg-${{ steps.build.outputs.version }}-py3-none-any.whl
          ANYMSG_TEST_SDIST: ${{ github.workspace }}/dist/anymsg-${{ steps.build.outputs.version }}.tar.gz
          DEEDKIT_TEST_SHARD: 1/4
        run: |
          DEEDKIT_TEST_ROUTER_IMAGE="$(docker image inspect --format '{{.Id}}' deedkit-release-router:ci)"
          export DEEDKIT_TEST_ROUTER_IMAGE
          python - <<'PY'
          import os
          from pathlib import Path
          p=Path(os.environ['PROBE_TEST_DSN_FILE'])
          p.write_text('postgresql://probe_owner:synthetic-ci-password@127.0.0.1:5432/messaging_probe_test')
          p.chmod(0o600)
          PY
          # The shard selector is the workflow commit's (ci-tools), not the tested source's, and only its own
          # directory joins pytest's import path; a baseline of an older revision is sharded the same way.
          mkdir -p "$RUNNER_TEMP/shard-plugin"
          cp ci-tools/scripts/python_shards.py ci-tools/scripts/python_shards.json "$RUNNER_TEMP/shard-plugin/"
          uv run python "$RUNNER_TEMP/shard-plugin/python_shards.py" pytest --tb=short --durations=25 -o junit_family=xunit1 --junitxml="$RUNNER_TEMP/ci-evidence/python-${DEEDKIT_TEST_SHARD%%/*}.xml" --ignore=tests/test_backup_r2_verifier_native.py tests
      - name: Isolated server backup restore with real age and PostgreSQL
        id: backup_restore
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: |
          python3 scripts/production.py check-image --target backup > "$RUNNER_TEMP/backup-image.json"
          restore_image="$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["image"])' "$RUNNER_TEMP/backup-image.json")"
          restore_revision="$(git rev-parse HEAD)"
          set +e
          sudo env DEEDKIT_TEST_BACKUP_IMAGE="$restore_image" DEEDKIT_TEST_BACKUP_REVISION="$restore_revision" \
            "$PWD/.venv/bin/python" -m pytest --tb=short -o junit_family=xunit1 \
            --junitxml="$RUNNER_TEMP/ci-evidence/backup-restore.xml" tests/test_backup_r2_verifier_native.py
          restore_test_exit=$?
          set -e
          if test -f "$RUNNER_TEMP/ci-evidence/backup-restore.xml"; then
            sudo chown "$(id -u):$(id -g)" "$RUNNER_TEMP/ci-evidence/backup-restore.xml"
          fi
          exit "$restore_test_exit"
      - name: Node collector tests
        id: collector
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: node --test --test-reporter=junit whatsapp/tests/*.test.mjs > "$RUNNER_TEMP/ci-evidence/collector.xml"
      - name: Node HTTP client tests
        id: npm
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        working-directory: packages/npm
        run: node --test --test-reporter=junit test/*.test.js > "$RUNNER_TEMP/ci-evidence/npm.xml"
      - name: Real synthetic MCP and HTTP with restricted gateway role
        id: smoke
        run: uv run python scripts/smoke.py --dsn-file "$RUNNER_TEMP/anymsg-test.dsn"
      - name: Installed distributions outside checkout
        id: distributions
        run: |
          uv venv "$RUNNER_TEMP/anymsg-wheel-env" --python 3.13
          uv pip install --python "$RUNNER_TEMP/anymsg-wheel-env/bin/python" dist/*.whl
          cd "$RUNNER_TEMP"
          anymsg_py="$RUNNER_TEMP/anymsg-wheel-env/bin/python"
          "$anymsg_py" -m anymsg --version
          "$RUNNER_TEMP/anymsg-wheel-env/bin/anymsg" --help
          "$anymsg_py" -m anymsg whatsapp-assets --directory "$RUNNER_TEMP/anymsg-node-assets"
          mkdir anymsg-npm-install
          cd anymsg-npm-install
          npm install --ignore-scripts --no-audit --no-fund "$GITHUB_WORKSPACE"/dist/*.tgz
          ./node_modules/.bin/anymsg --version
          node --input-type=module -e "import {AnyMsgClient} from 'anymsg'; if(typeof AnyMsgClient !== 'function')process.exit(1)"
      - name: Prepare honest CI evidence
        if: ${{ always() }}
        env:
          CHECK_OUTCOMES: >-
            {"build":"${{ steps.build.outcome }}","release":"${{ steps.release.outcome }}","python":"${{ steps.python.outcome }}","collector":"${{ steps.collector.outcome }}","npm":"${{ steps.npm.outcome }}","smoke":"${{ steps.smoke.outcome }}","distributions":"${{ steps.distributions.outcome }}"}
          MODULE_OUTCOMES: >-
            {"gateway":"${{ steps.gateway.outcome }}","calendar":"${{ steps.calendar.outcome }}","calls":"${{ steps.calls.outcome }}","calls_frontend":"${{ steps.calls_frontend.outcome }}","backup_restore":"${{ steps.backup_restore.outcome }}"}
          SOURCE_BRANCH: ${{ github.head_ref || github.ref_name }}
          TIDEN_BRANCH_OVERRIDE: ${{ inputs.tiden_branch }}
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          p=Path(os.environ['RUNNER_TEMP'])/'ci-evidence'
          metadata={'sha': (p/'source-sha').read_text().strip(), 'git_branch': os.environ['SOURCE_BRANCH'],
                    'tiden_branch': os.environ['TIDEN_BRANCH_OVERRIDE'], 'checks': json.loads(os.environ['CHECK_OUTCOMES']),
                    'module_checks': json.loads(os.environ['MODULE_OUTCOMES']),
                    'ci_url': f"https://github.com/{os.environ['GITHUB_REPOSITORY']}/actions/runs/{os.environ['GITHUB_RUN_ID']}/attempts/{os.environ['GITHUB_RUN_ATTEMPT']}"}
          (p/'metadata.json').write_text(json.dumps(metadata))
          PY
      - name: Retain test evidence even when a check fails
        # The evidence job merges this fragment with the other test jobs' fragments of the same commit.
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ci-evidence-verify
          path: ${{ runner.temp }}/ci-evidence
          if-no-files-found: error
          retention-days: 1
          overwrite: true
      - name: Require the tested source to be the commit receiving this check
        # Baseline evidence of another source_ref is still recorded above, but
        # this check must not report success on a commit it did not test.
        if: ${{ always() }}
        env:
          SOURCE_SHA: ${{ steps.source.outputs.sha }}
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          test -n "$SOURCE_SHA"
          test "$SOURCE_SHA" = "$EXPECTED_SHA"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: python-dist
          path: |
            dist/*.whl
            dist/*.tar.gz
          if-no-files-found: error
          retention-days: 7
          overwrite: true
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: npm-dist
          path: dist/*.tgz
          if-no-files-found: error
          retention-days: 7
          overwrite: true
  load:
    # The paired gateway load gate measures its latency and isolation budgets on a runner of its own,
    # in parallel with verify, instead of after the whole suite on the verify runner.
    needs: documentation
    if: ${{ !cancelled() && !inputs.reuse_queue_evidence && !inputs.reuse_pr_verification && needs.documentation.outputs.docs_only != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      source_sha: ${{ steps.source.outputs.sha }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
          ref: ${{ inputs.source_ref }}
      - name: Start evidence record
        id: source
        run: |
          mkdir -p "$RUNNER_TEMP/ci-evidence"
          git rev-parse HEAD > "$RUNNER_TEMP/ci-evidence/source-sha"
          echo "$GITHUB_RUN_ATTEMPT" > "$RUNNER_TEMP/ci-evidence/attempt"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with: {python-version: '3.13'}
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with: {version: '0.9.26'}
      - name: Install the gateway and the pinned load tools
        run: |
          (cd services/gateway && uv sync --locked --group dev)
          uv sync --project tools/dev --locked
      - name: Paired gateway load and isolation budgets
        id: load
        run: uv run --project tools/dev --locked python tests/platform/benchmarks/gateway_read_load.py --config tests/platform/benchmarks/budgets.json --output "$RUNNER_TEMP/ci-evidence/load.json" --junit "$RUNNER_TEMP/ci-evidence/load.xml"
      - name: Record the load outcome
        if: ${{ always() }}
        env:
          LOAD_OUTCOME: ${{ steps.load.outcome }}
        run: |
          python3 -c 'import json, os, pathlib; pathlib.Path(os.environ["RUNNER_TEMP"], "ci-evidence", "outcomes.json").write_text(json.dumps({"module_checks": {"load": os.environ["LOAD_OUTCOME"]}}))'
      - name: Retain load evidence even when the gate fails
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ci-evidence-load
          path: ${{ runner.temp }}/ci-evidence
          if-no-files-found: error
          retention-days: 1
          overwrite: true
  python:
    # Shards 2-4 of the root Python/PostgreSQL suite, in parallel with verify, which runs shard 1. Each shard has
    # its own runner and PostgreSQL and the same tools, images and environments as verify's suite step; every
    # test module belongs to exactly one shard (scripts/python_shards.py), and evidence merges their reports.
    name: python (${{ matrix.shard }}/4)
    needs: documentation
    if: ${{ !cancelled() && !inputs.reuse_queue_evidence && !inputs.reuse_pr_verification && needs.documentation.outputs.docs_only != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: [2, 3, 4]
    env:
      DEEDKIT_TEST_PYTHON_IMAGE: docker.io/library/python@sha256:a1165e272e578941b84abc79e4ab38a0305cd12803a5c4247979ac7655f4d641
    outputs:
      # A matrix job has one set of outputs that its jobs overwrite, so each shard job names its captured SHA
      # under an output of its own (an empty value overwrites nothing) and evidence compares each one.
      source_sha_2: ${{ steps.shard.outputs.sha_2 }}
      source_sha_3: ${{ steps.shard.outputs.sha_3 }}
      source_sha_4: ${{ steps.shard.outputs.sha_4 }}
    services:
      postgres:
        image: postgres:18-bookworm@sha256:afc7e2d441324c0388fa80c3d24f733b4194a4eb7f47dd8ee2b08eb1a24a647c
        env:
          POSTGRES_USER: probe_owner
          POSTGRES_PASSWORD: synthetic-ci-password
          POSTGRES_DB: messaging_probe_test
        ports: ['5432:5432']
        options: --health-cmd "pg_isready -U probe_owner -d messaging_probe_test" --health-interval 5s --health-timeout 3s --health-retries 12
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
          ref: ${{ inputs.source_ref }}
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
          path: ci-tools
      - name: Start evidence record
        id: source
        run: |
          mkdir -p "$RUNNER_TEMP/ci-evidence"
          git rev-parse HEAD > "$RUNNER_TEMP/ci-evidence/source-sha"
          echo "$GITHUB_RUN_ATTEMPT" > "$RUNNER_TEMP/ci-evidence/attempt"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Name the captured source for this shard
        id: shard
        env:
          SHARD: ${{ matrix.shard }}
          SOURCE_SHA: ${{ steps.source.outputs.sha }}
        run: echo "sha_$SHARD=$SOURCE_SHA" >> "$GITHUB_OUTPUT"
      - name: Start the release router image build and the Python image pull in the background
        run: |
          mkdir -p "$RUNNER_TEMP/background"
          finish() { if "${@:2}" > "$RUNNER_TEMP/background/$1.log" 2>&1; then echo 0; else echo 1; fi > "$RUNNER_TEMP/background/$1.tmp"; mv "$RUNNER_TEMP/background/$1.tmp" "$RUNNER_TEMP/background/$1.exit"; }
          revision="$(git rev-parse HEAD)"
          finish router docker build --file services/release-router/Dockerfile --tag deedkit-release-router:ci \
            --build-arg "VERSION_REF=$revision" --label "org.opencontainers.image.revision=$revision" \
            --label org.opencontainers.image.source=https://github.com/GoSync-Inc/deedkit . </dev/null >/dev/null 2>&1 &
          finish python-image docker pull "$DEEDKIT_TEST_PYTHON_IMAGE" </dev/null >/dev/null 2>&1 &
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with: {python-version: '3.13'}
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with: {node-version: '24'}
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with: {version: '0.9.26'}
      - name: Native extraction tools
        run: sudo apt-get update && sudo apt-get install -y poppler-utils tesseract-ocr tesseract-ocr-eng tesseract-ocr-rus ffmpeg age libglib2.0-0 libsndfile1 libopus0
      - name: Install pinned dependencies
        run: uv sync --frozen --group dev
      - name: Build the distributions the packaging tests inspect
        id: package
        run: |
          python - <<'PYCODE'
          import os,tomllib
          from pathlib import Path
          version=tomllib.loads(Path('services/messaging/pyproject.toml').read_text())['project']['version']
          with open(os.environ['GITHUB_OUTPUT'],'a') as output:output.write(f'version={version}\n')
          PYCODE
          uv build --project services/messaging --out-dir dist
      - name: Gateway and calendar environments the root suite starts
        run: |
          (cd services/gateway && uv sync --locked --group dev)
          (cd services/calendar && uv sync --locked --group dev)
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: '1.26.9'
          cache-dependency-path: whatsapp/whatsmeow/go.sum
      - name: Build native WhatsApp offline normalizer
        run: |
          cd whatsapp/whatsmeow
          go build -trimpath -o "$RUNNER_TEMP/anymsg-whatsmeow" .
          echo "ANYMSG_WHATSMEOW_TEST_BINARY=$RUNNER_TEMP/anymsg-whatsmeow" >> "$GITHUB_ENV"
      - name: Install the pinned gitleaks for the image-scan tests
        run: |
          curl --fail --silent --show-error --location --retry 3 -o "$RUNNER_TEMP/gitleaks.tar.gz" \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  $RUNNER_TEMP/gitleaks.tar.gz" | sha256sum --check --strict
          mkdir "$RUNNER_TEMP/gitleaks-bin"
          tar -xzf "$RUNNER_TEMP/gitleaks.tar.gz" -C "$RUNNER_TEMP/gitleaks-bin" gitleaks
          echo "GITLEAKS=$RUNNER_TEMP/gitleaks-bin/gitleaks" >> "$GITHUB_ENV"
      - name: Wait for the background router image and Python image
        env:
          BACKGROUND_WAIT_SECONDS: 900
        run: |
          for name in router python-image; do
            for _ in $(seq "$BACKGROUND_WAIT_SECONDS"); do
              test -f "$RUNNER_TEMP/background/$name.exit" && break
              sleep 1
            done
            if [ "$(cat "$RUNNER_TEMP/background/$name.exit" 2>/dev/null)" != 0 ]; then
              cat "$RUNNER_TEMP/background/$name.log" 2>/dev/null || true
              echo "::error::background $name preparation failed or did not finish"
              exit 1
            fi
          done
      - name: Python/PostgreSQL tests
        id: python
        env:
          PROBE_TEST_DSN_FILE: ${{ runner.temp }}/anymsg-test.dsn
          ANYMSG_TEST_POSTGRES_CONTAINER: ${{ job.services.postgres.id }}
          ANYMSG_TEST_WHEEL: ${{ github.workspace }}/dist/anymsg-${{ steps.package.outputs.version }}-py3-none-any.whl
          ANYMSG_TEST_SDIST: ${{ github.workspace }}/dist/anymsg-${{ steps.package.outputs.version }}.tar.gz
          DEEDKIT_TEST_SHARD: ${{ matrix.shard }}/4
        run: |
          DEEDKIT_TEST_ROUTER_IMAGE="$(docker image inspect --format '{{.Id}}' deedkit-release-router:ci)"
          export DEEDKIT_TEST_ROUTER_IMAGE
          python - <<'PY'
          import os
          from pathlib import Path
          p=Path(os.environ['PROBE_TEST_DSN_FILE'])
          p.write_text('postgresql://probe_owner:synthetic-ci-password@127.0.0.1:5432/messaging_probe_test')
          p.chmod(0o600)
          PY
          # The shard selector is the workflow commit's (ci-tools), not the tested source's, and only its own
          # directory joins pytest's import path; a baseline of an older revision is sharded the same way.
          mkdir -p "$RUNNER_TEMP/shard-plugin"
          cp ci-tools/scripts/python_shards.py ci-tools/scripts/python_shards.json "$RUNNER_TEMP/shard-plugin/"
          uv run python "$RUNNER_TEMP/shard-plugin/python_shards.py" pytest --tb=short --durations=25 -o junit_family=xunit1 --junitxml="$RUNNER_TEMP/ci-evidence/python-${DEEDKIT_TEST_SHARD%%/*}.xml" --ignore=tests/test_backup_r2_verifier_native.py tests
      - name: Record the shard outcome
        if: ${{ always() }}
        env:
          PYTHON_OUTCOME: ${{ steps.python.outcome }}
        run: |
          python3 -c 'import json, os, pathlib; pathlib.Path(os.environ["RUNNER_TEMP"], "ci-evidence", "outcomes.json").write_text(json.dumps({"checks": {"python": os.environ["PYTHON_OUTCOME"]}}))'
      - name: Retain shard evidence even when its tests fail
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ci-evidence-python-${{ matrix.shard }}
          path: ${{ runner.temp }}/ci-evidence
          if-no-files-found: error
          retention-days: 1
          overwrite: true
      - name: Require the tested source to be the commit receiving this check
        if: ${{ always() }}
        env:
          SOURCE_SHA: ${{ steps.source.outputs.sha }}
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          test -n "$SOURCE_SHA"
          test "$SOURCE_SHA" = "$EXPECTED_SHA"
  evidence:
    # One `ci-evidence` artifact from every test job's fragment, attempted even after a failure so the
    # failure itself is recorded (TIDEN-CI.md). A missing, failed, cancelled or skipped test job fails
    # this job whether or not Tiden reporting is configured.
    needs: [documentation, verify, load, python]
    if: ${{ always() && !inputs.reuse_queue_evidence && !inputs.reuse_pr_verification && needs.documentation.outputs.docs_only != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
          ref: ${{ inputs.source_ref }}
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
          path: ci-tools
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: ci-evidence-*
          path: ${{ runner.temp }}/fragments
      - name: Merge the fragments of the tested commit and record every check outcome
        # A job's fragment counts only with its job result and captured checkout SHA; without a fresh fragment
        # its checks take that result, never a pass. Evidence is prepared either way, then a missing one fails.
        env:
          VERIFY: verify:${{ needs.verify.result }}:${{ needs.verify.outputs.source_sha }}
          LOAD: load:${{ needs.load.result }}:${{ needs.load.outputs.source_sha }}
          # A matrix job has one result for all its jobs, so each shard job takes the matrix result.
          PYTHON_2: python-2:${{ needs.python.result }}:${{ needs.python.outputs.source_sha_2 }}
          PYTHON_3: python-3:${{ needs.python.result }}:${{ needs.python.outputs.source_sha_3 }}
          PYTHON_4: python-4:${{ needs.python.result }}:${{ needs.python.outputs.source_sha_4 }}
        run: |
          assembled=0
          python ci-tools/scripts/tiden_ci.py assemble --directory "$RUNNER_TEMP/ci-evidence" --fragments "$RUNNER_TEMP/fragments" \
            --producer "$VERIFY" --producer "$LOAD" --producer "$PYTHON_2" --producer "$PYTHON_3" --producer "$PYTHON_4" || assembled=$?
          python ci-tools/scripts/tiden_ci.py prepare --directory "$RUNNER_TEMP/ci-evidence"
          exit "$assembled"
      - name: Retain test evidence even when a check fails
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ci-evidence
          path: ${{ runner.temp }}/ci-evidence
          if-no-files-found: error
          retention-days: 14
          # Artifact names are unique per run, so a rerun attempt replaces its earlier evidence.
          overwrite: true
      - name: Require every test job to have succeeded
        if: ${{ always() }}
        env:
          VERIFY_RESULT: ${{ needs.verify.result }}
          LOAD_RESULT: ${{ needs.load.result }}
          PYTHON_RESULT: ${{ needs.python.result }}
        run: |
          test "$VERIFY_RESULT" = success
          test "$LOAD_RESULT" = success
          test "$PYTHON_RESULT" = success
  tiden:
    needs: [documentation, evidence]
    # PRs from forks never receive credentials. Internal PRs retain their actual
    # tested merge SHA, not the head SHA or the last successful main revision.
    if: ${{ always() && !cancelled() && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Check optional Tiden configuration
        id: config
        env:
          TIDEN_API_TOKEN: ${{ secrets.TIDEN_API_TOKEN }}
          TIDEN_PRODUCT_ID: ${{ vars.TIDEN_PRODUCT_ID }}
          TIDEN_WORKSPACE_ID: ${{ vars.TIDEN_WORKSPACE_ID }}
          EVENT_NAME: ${{ github.event_name }}
          SOURCE_BRANCH: ${{ github.head_ref || github.ref_name }}
          DOCS_ONLY: ${{ needs.documentation.outputs.docs_only }}
          PR_REUSED: ${{ inputs.reuse_pr_verification }}
        run: |
          # A merge queue run publishes nothing, so it needs no Tiden configuration or CLI.
          # Matched with case, like scripts/tiden_ci.py; expression startsWith() ignores case.
          if [ "$EVENT_NAME" = merge_group ] && [ "$PR_REUSED" = true ]; then
            # A queue run that reused the pull request verification ran no tests and assembled no evidence.
            echo 'enabled=false' >> "$GITHUB_OUTPUT"
            echo 'pr_reused=true' >> "$GITHUB_OUTPUT"
          elif [ "$EVENT_NAME" = merge_group ] || [[ "$SOURCE_BRANCH" == gh-readonly-queue/* ]]; then
            echo 'enabled=false' >> "$GITHUB_OUTPUT"
            echo 'queue=true' >> "$GITHUB_OUTPUT"
          elif [ "$DOCS_ONLY" = true ]; then
            # A docs-only pull request run ran no tests, so it has no evidence to publish.
            echo 'enabled=false' >> "$GITHUB_OUTPUT"
            echo 'docs_only=true' >> "$GITHUB_OUTPUT"
          elif [ -z "$TIDEN_API_TOKEN" ]; then
            echo 'enabled=false' >> "$GITHUB_OUTPUT"
            echo 'Tiden reporting is not configured; see TIDEN-CI.md.' >> "$GITHUB_STEP_SUMMARY"
          else
            test -n "$TIDEN_PRODUCT_ID" && test -n "$TIDEN_WORKSPACE_ID"
            echo 'enabled=true' >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        if: steps.config.outputs.enabled == 'true' || steps.config.outputs.queue == 'true'
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        if: steps.config.outputs.enabled == 'true' || steps.config.outputs.queue == 'true'
        with:
          name: ci-evidence
          path: ${{ runner.temp }}/ci-evidence
      - name: Install pinned Tiden CLI with integrity check
        if: steps.config.outputs.enabled == 'true'
        run: |
          curl --fail --silent --show-error --location https://github.com/qase-tms/homebrew-tap/releases/download/v0.33.0/tiden_linux_amd64.tar.gz -o "$RUNNER_TEMP/tiden.tar.gz"
          echo "3f6b650c4cabd58ce4149d9106325cbd36d1472cccc9c63ca03137668b80e4a6  $RUNNER_TEMP/tiden.tar.gz" | sha256sum --check
          mkdir "$RUNNER_TEMP/tiden-bin"
          tar -xzf "$RUNNER_TEMP/tiden.tar.gz" -C "$RUNNER_TEMP/tiden-bin"
          echo "$RUNNER_TEMP/tiden-bin" >> "$GITHUB_PATH"
      - name: Publish and verify branch association
        if: steps.config.outputs.enabled == 'true'
        env:
          TIDEN_API_TOKEN: ${{ secrets.TIDEN_API_TOKEN }}
          TIDEN_PRODUCT_ID: ${{ vars.TIDEN_PRODUCT_ID }}
          TIDEN_WORKSPACE_ID: ${{ vars.TIDEN_WORKSPACE_ID }}
          TIDEN_BASE_URL: https://app.tiden.ai
          TIDEN_BRANCH_MAP: ${{ vars.TIDEN_BRANCH_MAP }}
        run: python scripts/tiden_ci.py publish --directory "$RUNNER_TEMP/ci-evidence"
      - name: Record that a merge queue run publishes nothing
        if: steps.config.outputs.queue == 'true'
        run: python scripts/tiden_ci.py publish --directory "$RUNNER_TEMP/ci-evidence"
      - name: Record that a docs-only pull request run publishes nothing
        if: steps.config.outputs.docs_only == 'true'
        env:
          REASON: docs-only pull request run of reviewed documentation; no tests ran, and main CI publishes the merged code
        run: |
          python3 -c 'import json, os, pathlib; d = pathlib.Path(os.environ["RUNNER_TEMP"], "ci-evidence"); d.mkdir(parents=True, exist_ok=True); (d / "tiden-route.json").write_text(json.dumps({"branch": None, "source": "skipped", "reason": os.environ["REASON"]}))'
          echo "::notice title=Tiden evidence not published::$REASON"
      - name: Record that a merge queue run reusing the pull request verification publishes nothing
        if: steps.config.outputs.pr_reused == 'true'
        env:
          REASON: merge queue run reused the verification of a pull request run that tested this exact tree; no tests ran, and main CI verifies and publishes the merged code
          TESTED_IN: ${{ inputs.reused_pr_run }}
          TESTED_SHA: ${{ inputs.reused_pr_tested_sha }}
          GROUP_SHA: ${{ github.sha }}
          REPOSITORY: ${{ github.repository }}
        run: |
          # The receipt names the exact pull request run attempt and tested commit; without them the reuse is unproven.
          python3 - <<'PY'
          import json, os, pathlib, re
          env = os.environ
          url = r"https://github\.com/" + re.escape(env["REPOSITORY"]) + r"/actions/runs/[0-9]+/attempts/[0-9]+"
          if not (re.fullmatch(url, env["TESTED_IN"]) and re.fullmatch(r"[0-9a-f]{40}", env["TESTED_SHA"])
                  and re.fullmatch(r"[0-9a-f]{40}", env["GROUP_SHA"])):
              raise SystemExit("the reused pull request run or its tested commit is not named")
          directory = pathlib.Path(env["RUNNER_TEMP"], "ci-evidence")
          directory.mkdir(parents=True, exist_ok=True)
          (directory / "tiden-route.json").write_text(json.dumps({
              "branch": None, "source": "skipped", "reason": env["REASON"], "tested_in": env["TESTED_IN"],
              "tested_sha": env["TESTED_SHA"], "group_sha": env["GROUP_SHA"]}))
          PY
          echo "::notice title=Tiden evidence not published::$REASON ($TESTED_IN)"
      - name: Retain Tiden association and verdict receipt
        if: ${{ always() && ((steps.config.outputs.enabled == 'true' || steps.config.outputs.queue == 'true') || steps.config.outputs.docs_only == 'true' || steps.config.outputs.pr_reused == 'true') }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: tiden-receipt
          path: ${{ runner.temp }}/ci-evidence/tiden-*.json
          if-no-files-found: warn
          retention-days: 14
          # A rerun attempt replaces its earlier receipt instead of failing on the existing name.
          overwrite: true
