  python-3:
    name: python (${{ matrix.shard }}/4)
    needs: documentation
    if: ${{ !cancelled() && !inputs.reuse_queue_evidence && !inputs.reuse_pr_verification && needs.documentation.outputs.docs_only != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      matrix:
        shard: [3]
    env:
      DEEDKIT_TEST_PYTHON_IMAGE: docker.io/library/python@sha256:a1165e272e578941b84abc79e4ab38a0305cd12803a5c4247979ac7655f4d641
    outputs:
      source_sha: ${{ steps.source.outputs.sha }}
    services: *python-shard-services
    steps: *python-shard-steps
  python-4:
    name: python (${{ matrix.shard }}/4)
    needs: documentation
    if: ${{ !cancelled() && !inputs.reuse_queue_evidence && !inputs.reuse_pr_verification && needs.documentation.outputs.docs_only != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      matrix:
        shard: [4]
    env:
      DEEDKIT_TEST_PYTHON_IMAGE: docker.io/library/python@sha256:a1165e272e578941b84abc79e4ab38a0305cd12803a5c4247979ac7655f4d641
    outputs:
      source_sha: ${{ steps.source.outputs.sha }}
    services: *python-shard-services
    steps: *python-shard-steps
  evidence:
    # One `ci-evidence` artifact from every test job's fragment, attempted even after a failure so the
    # failure itself is recorded (TIDEN-CI.md). A missing, failed, cancelled or skipped test job fails
    # this job whether or not Tiden reporting is configured.
    needs: [documentation, verify, load, python-2, python-3, python-4, go]
    if: ${{ always() && !inputs.reuse_queue_evidence && !inputs.reuse_pr_verification && needs.documentation.outputs.docs_only != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
          ref: ${{ inputs.source_ref }}
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
          path: ci-tools
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: ci-evidence-*
          path: ${{ runner.temp }}/fragments
      - name: Merge the fragments of the tested commit and record every check outcome
        # A job's fragment counts only with its job result and captured checkout SHA; without a fresh fragment
        # its checks take that result, never a pass. Evidence is prepared either way, then a missing one fails.
        env:
          VERIFY: verify:${{ needs.verify.result }}:${{ needs.verify.outputs.source_sha }}
          LOAD: load:${{ needs.load.result }}:${{ needs.load.outputs.source_sha }}
          PYTHON_2: python-2:${{ needs.python-2.result }}:${{ needs.python-2.outputs.source_sha }}
          PYTHON_3: python-3:${{ needs.python-3.result }}:${{ needs.python-3.outputs.source_sha }}
          PYTHON_4: python-4:${{ needs.python-4.result }}:${{ needs.python-4.outputs.source_sha }}
          GO: go:${{ needs.go.result }}:${{ needs.go.outputs.source_sha }}
        run: |
          assembled=0
          python ci-tools/scripts/tiden_ci.py assemble --directory "$RUNNER_TEMP/ci-evidence" --fragments "$RUNNER_TEMP/fragments" \
            --producer "$VERIFY" --producer "$LOAD" --producer "$PYTHON_2" --producer "$PYTHON_3" --producer "$PYTHON_4" \
            --producer "$GO" || assembled=$?
          python ci-tools/scripts/tiden_ci.py prepare --directory "$RUNNER_TEMP/ci-evidence"
          exit "$assembled"
      - name: Retain test evidence even when a check fails
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ci-evidence
          path: ${{ runner.temp }}/ci-evidence
          if-no-files-found: error
          retention-days: 14
          # Artifact names are unique per run, so a rerun attempt replaces its earlier evidence.
          overwrite: true
      - name: Require every recorded test and check to have passed
        # Failed tests and failed or blocked checks (a missing, invalid or only-skipped report) fail here, so the
        # gate never depends on the Tiden publication, which only warns (TIDEN-CI.md).
        if: ${{ always() }}
        run: python ci-tools/scripts/tiden_ci.py verdict --directory "$RUNNER_TEMP/ci-evidence"
      - name: Require every test job to have succeeded
        if: ${{ always() }}
        env:
          VERIFY_RESULT: ${{ needs.verify.result }}
          LOAD_RESULT: ${{ needs.load.result }}
          PYTHON_2_RESULT: ${{ needs.python-2.result }}
          PYTHON_3_RESULT: ${{ needs.python-3.result }}
          PYTHON_4_RESULT: ${{ needs.python-4.result }}
          GO_RESULT: ${{ needs.go.result }}
        run: |
          test "$VERIFY_RESULT" = success
          test "$LOAD_RESULT" = success
          test "$PYTHON_2_RESULT" = success
          test "$PYTHON_3_RESULT" = success
          test "$PYTHON_4_RESULT" = success
          test "$GO_RESULT" = success
  tiden_pr:
    # Check A (ANYM-405, TIDEN-CI.md): the pull request's `Spec:`/`Delivers:`/`Tiden branch:` lines, the markers
    # of its new tests and the anchors of its changed code files, read-only against Tiden. Only a verdict fails the
    # run, and so CI gate, before the merge. Any other outcome (a Tiden CLI failure, an unexpected error, a failed
    # CLI install, a check killed at its timeout) warns with a receipt, as the evidence publication does. The script
    # skips a fork and a run without the token; the merge queue and main pushes have no pull request body to check.
    name: Tiden PR check
    if: ${{ github.event_name == 'pull_request' && inputs.source_ref == '' }}
    runs-on: ubuntu-latest
    # Above the sum of the step timeouts, so the verdict, the warning and the receipt always have their time.
    timeout-minutes: 25
    # Every step but `Fail on the verdict` continues on error: whatever breaks before or after the check warns.
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        id: checkout
        continue-on-error: true
        timeout-minutes: 3
        with:
          persist-credentials: false
          # The merge base with the base commit and the files before the change come from the history.
          fetch-depth: 0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        id: python
        continue-on-error: true
        timeout-minutes: 2
        with: {python-version: '3.13'}
      - name: Install pinned Tiden CLI with integrity check
        id: install
        if: steps.checkout.outcome == 'success' && steps.python.outcome == 'success'
        continue-on-error: true
        timeout-minutes: 2
        run: |
          pin="$GITHUB_WORKSPACE/docs/harness/tiden.md"
          ver=$(sed -n 's/^TIDEN_CLI_VERSION=\([0-9][0-9]*\.[0-9][0-9]*\.[0-9][0-9]*\)$/\1/p' "$pin" | head -n 1)
          sum=$(sed -n 's/^TIDEN_CLI_SHA256_linux_amd64=\([0-9a-f]\{64\}\)$/\1/p' "$pin" | head -n 1)
          [ -n "$ver" ] && [ -n "$sum" ] || { echo "no valid Tiden pin in $pin" >&2; exit 1; }
          curl --fail --silent --show-error --location -o "$RUNNER_TEMP/tiden.tar.gz" \
            "https://github.com/qase-tms/homebrew-tap/releases/download/v$ver/tiden_linux_amd64.tar.gz"
          echo "$sum  $RUNNER_TEMP/tiden.tar.gz" | sha256sum --check --strict
          mkdir "$RUNNER_TEMP/tiden-bin"
          tar -xzf "$RUNNER_TEMP/tiden.tar.gz" -C "$RUNNER_TEMP/tiden-bin"
          echo "$RUNNER_TEMP/tiden-bin" >> "$GITHUB_PATH"
      # The step never fails the job itself: it records `outcome`, and a step killed at its timeout records none.
      - name: Check the spec lines, test markers and anchors
        id: check
        if: steps.install.outcome == 'success'
        continue-on-error: true
        timeout-minutes: 8
        env:
          TIDEN_API_TOKEN: ${{ secrets.TIDEN_API_TOKEN }}
          TIDEN_PRODUCT_ID: ${{ vars.TIDEN_PRODUCT_ID }}
          TIDEN_WORKSPACE_ID: ${{ vars.TIDEN_WORKSPACE_ID }}
          TIDEN_BASE_URL: https://app.tiden.ai
        run: |
          set +e
          python scripts/tiden_pr_check.py > "$RUNNER_TEMP/tiden-pr-check.txt"
          status=$?
          set -e
          cat "$RUNNER_TEMP/tiden-pr-check.txt"
          last=$(tail -n 1 "$RUNNER_TEMP/tiden-pr-check.txt")
          # A verdict is the script's closing line after its problem list, or a refusal of the pull request's own
          # content; every other line the script or a crash can end with is no verdict (tests/test_tiden_pr_check.py).
          verdict='Fix the pull request body or the markers (TIDEN-CI.md, PR check), then rerun.'
          content='^Refused: (.+ does not parse \(.+\)|a changed path is not valid UTF-8)$'
          if [ "$status" -eq 0 ]; then
            echo 'outcome=passed' >> "$GITHUB_OUTPUT"
          elif [ "$status" -eq 1 ] && { [ "$last" = "$verdict" ] || [[ "$last" =~ $content ]]; }; then
            echo 'outcome=failed' >> "$GITHUB_OUTPUT"
          else
            echo 'outcome=unchecked' >> "$GITHUB_OUTPUT"
          fi
      - name: Fail on the verdict
        if: steps.check.outputs.outcome == 'failed'
        timeout-minutes: 1
        run: |
          echo '::error title=Tiden PR check failed::see the problems listed above and in the job summary (TIDEN-CI.md)'
          exit 1
      - name: Warn that Tiden could not check this pull request
        id: warn
        if: ${{ !cancelled() && steps.check.outputs.outcome != 'passed' && steps.check.outputs.outcome != 'failed' }}
        continue-on-error: true
        timeout-minutes: 1
        env:
          PREPARE: checkout ${{ steps.checkout.outcome }}, Python ${{ steps.python.outcome }}
          INSTALL: ${{ steps.install.outcome }}
          CHECK: ${{ steps.check.outcome }}
        run: |
          python3 - <<'PY'
          import json, os, pathlib
          output = pathlib.Path(os.environ["RUNNER_TEMP"], "tiden-pr-check.txt")
          lines = output.read_text(errors="replace").splitlines() if output.exists() else []
          directory = pathlib.Path(os.environ["RUNNER_TEMP"], "tiden-pr-check")
          directory.mkdir(parents=True, exist_ok=True)
          (directory / "tiden-pr-check.json").write_text(json.dumps({
              "checked": False, "prepare": os.environ["PREPARE"], "install": os.environ["INSTALL"] or "not run",
              "check": os.environ["CHECK"] or "not run",
              "reason": lines[-1] if lines else None}))
          PY
          message="${PREPARE}; CLI install: ${INSTALL:-not run}; check: ${CHECK:-not run}. The sync and Tiden drift still check after the merge; rerun this job to check now (TIDEN-CI.md)"
          echo "::warning title=Tiden PR check not run::$message"
          echo "Tiden PR check not run. $message" >> "$GITHUB_STEP_SUMMARY"
      # Best effort: an artifact service outage leaves the warning in the log and the summary.
      - name: Retain the Tiden PR check receipt
        if: ${{ !cancelled() && steps.check.outputs.outcome != 'passed' && steps.check.outputs.outcome != 'failed' }}
        continue-on-error: true
        timeout-minutes: 3
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: tiden-pr-check-receipt
          path: ${{ runner.temp }}/tiden-pr-check/tiden-pr-check.json
          if-no-files-found: warn
          retention-days: 14
          overwrite: true
  tiden:
    needs: [documentation, evidence]
    # PRs from forks never receive credentials. Internal PRs retain their actual
    # tested merge SHA, not the head SHA or the last successful main revision.
    if: ${{ always() && !cancelled() && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
    runs-on: ubuntu-latest
    # Every step has a timeout and together they stay below the job's, so a hung Tiden call ends as a step
    # failure, which only warns, and never as a cancelled job.
    timeout-minutes: 20
    outputs:
      published: ${{ steps.publish.outcome == 'success' && steps.publish.outputs.verified == 'true' }}
    steps:
      - name: Check optional Tiden configuration
        id: config
        timeout-minutes: 1
        env:
          TIDEN_API_TOKEN: ${{ secrets.TIDEN_API_TOKEN }}
          TIDEN_PRODUCT_ID: ${{ vars.TIDEN_PRODUCT_ID }}
          TIDEN_WORKSPACE_ID: ${{ vars.TIDEN_WORKSPACE_ID }}
          EVENT_NAME: ${{ github.event_name }}
          SOURCE_BRANCH: ${{ github.head_ref || github.ref_name }}
          DOCS_ONLY: ${{ needs.documentation.outputs.docs_only }}
          PR_REUSED: ${{ inputs.reuse_pr_verification }}
        run: |
          # A merge queue run publishes nothing, so it needs no Tiden configuration or CLI.
          # Matched with case, like scripts/tiden_ci.py; expression startsWith() ignores case.
          if [ "$EVENT_NAME" = merge_group ] && [ "$PR_REUSED" = true ]; then
            # A queue run that reused the pull request verification ran no tests and assembled no evidence.
            echo 'enabled=false' >> "$GITHUB_OUTPUT"
            echo 'pr_reused=true' >> "$GITHUB_OUTPUT"
          elif [ "$DOCS_ONLY" = true ]; then
            # A docs-only pull request or merge queue run ran no tests, so it has no evidence to publish.
            echo 'enabled=false' >> "$GITHUB_OUTPUT"
            echo 'docs_only=true' >> "$GITHUB_OUTPUT"
          elif [ "$EVENT_NAME" = merge_group ] || [[ "$SOURCE_BRANCH" == gh-readonly-queue/* ]]; then
            echo 'enabled=false' >> "$GITHUB_OUTPUT"
            echo 'queue=true' >> "$GITHUB_OUTPUT"
          elif [ -z "$TIDEN_API_TOKEN" ]; then
            echo 'enabled=false' >> "$GITHUB_OUTPUT"
            echo 'Tiden reporting is not configured; see TIDEN-CI.md.' >> "$GITHUB_STEP_SUMMARY"
          else
            # One test per line: under bash -e a failed test before `&&` would not stop the step.
            test -n "$TIDEN_PRODUCT_ID"
            test -n "$TIDEN_WORKSPACE_ID"
            echo 'enabled=true' >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        if: steps.config.outputs.enabled == 'true' || steps.config.outputs.queue == 'true'
        timeout-minutes: 2
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
      # A merge queue run publishes nothing and its receipt needs no evidence: checks / evidence already enforced it,
      # so a hung download cannot fail the queue (ANYM-500).
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        if: steps.config.outputs.enabled == 'true'
        timeout-minutes: 3
        with:
          name: ci-evidence
          path: ${{ runner.temp }}/ci-evidence
      # The publication reports the verdict that checks / evidence already enforced; its failure only warns.
      - name: Install pinned Tiden CLI with integrity check
        id: install
        if: steps.config.outputs.enabled == 'true'
        continue-on-error: true
        timeout-minutes: 2
        run: |
          pin="$GITHUB_WORKSPACE/docs/harness/tiden.md"
          ver=$(sed -n 's/^TIDEN_CLI_VERSION=\([0-9][0-9]*\.[0-9][0-9]*\.[0-9][0-9]*\)$/\1/p' "$pin" | head -n 1)
          sum=$(sed -n 's/^TIDEN_CLI_SHA256_linux_amd64=\([0-9a-f]\{64\}\)$/\1/p' "$pin" | head -n 1)
          [ -n "$ver" ] && [ -n "$sum" ] || { echo "no valid Tiden pin in $pin" >&2; exit 1; }
          curl --fail --silent --show-error --location -o "$RUNNER_TEMP/tiden.tar.gz" \
            "https://github.com/qase-tms/homebrew-tap/releases/download/v$ver/tiden_linux_amd64.tar.gz"
          echo "$sum  $RUNNER_TEMP/tiden.tar.gz" | sha256sum --check --strict
          mkdir "$RUNNER_TEMP/tiden-bin"
          tar -xzf "$RUNNER_TEMP/tiden.tar.gz" -C "$RUNNER_TEMP/tiden-bin"
          echo "$RUNNER_TEMP/tiden-bin" >> "$GITHUB_PATH"
      - name: Publish and verify branch association
        id: publish
        if: steps.config.outputs.enabled == 'true'
        continue-on-error: true
        timeout-minutes: 3
        env:
          TIDEN_API_TOKEN: ${{ secrets.TIDEN_API_TOKEN }}
          TIDEN_PRODUCT_ID: ${{ vars.TIDEN_PRODUCT_ID }}
          TIDEN_WORKSPACE_ID: ${{ vars.TIDEN_WORKSPACE_ID }}
          TIDEN_BASE_URL: https://app.tiden.ai
          TIDEN_BRANCH_MAP: ${{ vars.TIDEN_BRANCH_MAP }}
        run: python scripts/tiden_ci.py publish --directory "$RUNNER_TEMP/ci-evidence"
      - name: Warn that the evidence was not published to Tiden
        if: ${{ always() && steps.config.outputs.enabled == 'true' && (steps.install.outcome != 'success' || steps.publish.outcome != 'success') }}
        timeout-minutes: 1
        env:
          INSTALL: ${{ steps.install.outcome }}
          PUBLISH: ${{ steps.publish.outcome }}
        run: |
          python3 -c 'import json, os, pathlib; d = pathlib.Path(os.environ["RUNNER_TEMP"], "ci-evidence"); d.mkdir(parents=True, exist_ok=True); (d / "tiden-publication.json").write_text(json.dumps({"published": False, "install": os.environ["INSTALL"], "publish": os.environ["PUBLISH"]}))'
          message="CLI install: ${INSTALL:-not run}; publication: ${PUBLISH:-not run}. CI gate does not wait for Tiden; rerun all jobs to publish (TIDEN-CI.md)"
          echo "::warning title=Tiden evidence not published::$message"
          echo "Tiden evidence not published. $message" >> "$GITHUB_STEP_SUMMARY"
      - name: Record that a merge queue run publishes nothing
        if: steps.config.outputs.queue == 'true'
        timeout-minutes: 1
        run: python scripts/tiden_ci.py queue-receipt --directory "$RUNNER_TEMP/ci-evidence"
      - name: Record that a docs-only run publishes nothing
        if: steps.config.outputs.docs_only == 'true'
        timeout-minutes: 1
        env:
          REASON: docs-only run of documentation paths; no tests ran, and the main push run verifies and publishes the merged code
        run: |
          python3 -c 'import json, os, pathlib; d = pathlib.Path(os.environ["RUNNER_TEMP"], "ci-evidence"); d.mkdir(parents=True, exist_ok=True); (d / "tiden-route.json").write_text(json.dumps({"branch": None, "source": "skipped", "reason": os.environ["REASON"]}))'
          echo "::notice title=Tiden evidence not published::$REASON"
      - name: Record that a merge queue run reusing the pull request verification publishes nothing
        if: steps.config.outputs.pr_reused == 'true'
        timeout-minutes: 1
        env:
          REASON: merge queue run reused the verification of a pull request run that tested this exact tree; no tests ran, and main CI verifies and publishes the merged code
          TESTED_IN: ${{ inputs.reused_pr_run }}
          TESTED_SHA: ${{ inputs.reused_pr_tested_sha }}
          GROUP_SHA: ${{ github.sha }}
          REPOSITORY: ${{ github.repository }}
        run: |
          # The receipt names the exact pull request run attempt and tested commit; without them the reuse is unproven.
          python3 - <<'PY'
          import json, os, pathlib, re
          env = os.environ
          url = r"https://github\.com/" + re.escape(env["REPOSITORY"]) + r"/actions/runs/[0-9]+/attempts/[0-9]+"
          if not (re.fullmatch(url, env["TESTED_IN"]) and re.fullmatch(r"[0-9a-f]{40}", env["TESTED_SHA"])
                  and re.fullmatch(r"[0-9a-f]{40}", env["GROUP_SHA"])):
              raise SystemExit("the reused pull request run or its tested commit is not named")
          directory = pathlib.Path(env["RUNNER_TEMP"], "ci-evidence")
          directory.mkdir(parents=True, exist_ok=True)
          (directory / "tiden-route.json").write_text(json.dumps({
              "branch": None, "source": "skipped", "reason": env["REASON"], "tested_in": env["TESTED_IN"],
              "tested_sha": env["TESTED_SHA"], "group_sha": env["GROUP_SHA"]}))
          PY
          echo "::notice title=Tiden evidence not published::$REASON ($TESTED_IN)"
      - name: Retain Tiden association and verdict receipt
        if: ${{ always() && ((steps.config.outputs.enabled == 'true' || steps.config.outputs.queue == 'true') || steps.config.outputs.docs_only == 'true' || steps.config.outputs.pr_reused == 'true') }}
        timeout-minutes: 3
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: tiden-receipt
          path: ${{ runner.temp }}/ci-evidence/tiden-*.json
          if-no-files-found: warn
          retention-days: 14
          # A rerun attempt replaces its earlier receipt instead of failing on the existing name.
          overwrite: true
