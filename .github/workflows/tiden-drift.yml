name: Tiden drift
on:
  # After every Tiden sync run (ANYM-593): sync B anchors a merge's new files, so drift checks main only once every
  # merge after the watermark has a successful sync, and the run after the last sync covers them. Any completion
  # triggers a run (a skipped sync too): a run only reads main, so none is filtered out of the concurrency queue.
  # A dispatch reconciles main again after anchors were added (TIDEN-CI.md).
  workflow_run:  # zizmor: ignore[dangerous-triggers] only runs of this repository pass the guards; it checks out main, not the upstream head
    workflows: [Tiden sync]
    types: [completed]
  workflow_dispatch:
permissions:
  contents: read
  # The listing of the Tiden sync runs of main; read only, reaches the checker step as GH_TOKEN.
  actions: read
concurrency:
  # Runs never overlap. GitHub may replace a pending run with a newer one; each run checks the head of main when it
  # starts, not its event commit, so whichever run executes last covers every merge.
  group: tiden-drift
  cancel-in-progress: false
jobs:
  anchors:
    name: Anchors and watermark
    # Only the reviewed workflow and tools on main may use the Tiden credential.
    if: >-
      github.ref == 'refs/heads/main' && (github.event_name == 'workflow_dispatch' ||
      github.event_name == 'workflow_run')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # Expression comparisons ignore case; this one does not, and runs before any repository code.
      - name: Require the main branch exactly
        env:
          REF: ${{ github.ref }}
        run: test "$REF" = refs/heads/main
      - name: Check optional Tiden configuration
        id: config
        # Only whether the secret exists; the token itself reaches the checker step alone.
        env:
          HAS_TOKEN: ${{ secrets.TIDEN_API_TOKEN != '' }}
          TIDEN_PRODUCT_ID: ${{ vars.TIDEN_PRODUCT_ID }}
          TIDEN_WORKSPACE_ID: ${{ vars.TIDEN_WORKSPACE_ID }}
        run: |
          if [ "$HAS_TOKEN" != true ]; then
            echo 'enabled=false' >> "$GITHUB_OUTPUT"
            echo 'Tiden reporting is not configured; see TIDEN-CI.md.' >> "$GITHUB_STEP_SUMMARY"
          else
            test -n "$TIDEN_PRODUCT_ID"
            test -n "$TIDEN_WORKSPACE_ID"
            echo 'enabled=true' >> "$GITHUB_OUTPUT"
          fi
      # Expression comparisons ignore case; these do not, and run before any repository code. The upstream sync run
      # is this repository's own (its title is never read), so main's checker and pinned CLI run on main's checkout.
      - name: Require a Tiden sync run of this repository or a dispatch
        if: steps.config.outputs.enabled == 'true'
        env:
          EVENT: ${{ github.event_name }}
          UPSTREAM_EVENT: ${{ github.event.workflow_run.event }}
          UPSTREAM_REPOSITORY: ${{ github.event.workflow_run.repository.full_name }}
          UPSTREAM_HEAD_REPOSITORY: ${{ github.event.workflow_run.head_repository.full_name }}
          REPOSITORY: ${{ github.repository }}
        run: |
          if [ "$EVENT" = workflow_run ]; then
            test "$UPSTREAM_REPOSITORY" = "$REPOSITORY"
            test "$UPSTREAM_HEAD_REPOSITORY" = "$REPOSITORY"
            case "$UPSTREAM_EVENT" in workflow_run | workflow_dispatch) ;; *) exit 1 ;; esac
          else
            test "$EVENT" = workflow_dispatch
          fi
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        if: steps.config.outputs.enabled == 'true'
        with:
          persist-credentials: false
          ref: main
          fetch-depth: 0
      # The checker calls the CLI by its path; a workflow_run job writes nothing to GITHUB_PATH or GITHUB_ENV.
      - name: Install pinned Tiden CLI with integrity check
        if: steps.config.outputs.enabled == 'true'
        run: |
          pin="$GITHUB_WORKSPACE/docs/harness/tiden.md"
          ver=$(sed -n 's/^TIDEN_CLI_VERSION=\([0-9][0-9]*\.[0-9][0-9]*\.[0-9][0-9]*\)$/\1/p' "$pin" | head -n 1)
          sum=$(sed -n 's/^TIDEN_CLI_SHA256_linux_amd64=\([0-9a-f]\{64\}\)$/\1/p' "$pin" | head -n 1)
          [ -n "$ver" ] && [ -n "$sum" ] || { echo "no valid Tiden pin in $pin" >&2; exit 1; }
          curl --fail --silent --show-error --location -o "$RUNNER_TEMP/tiden.tar.gz" \
            "https://github.com/qase-tms/homebrew-tap/releases/download/v$ver/tiden_linux_amd64.tar.gz"
          echo "$sum  $RUNNER_TEMP/tiden.tar.gz" | sha256sum --check --strict
          mkdir "$RUNNER_TEMP/tiden-bin"
          tar -xzf "$RUNNER_TEMP/tiden.tar.gz" -C "$RUNNER_TEMP/tiden-bin"
      - name: Require an anchor for every changed code file, then advance the watermark
        if: steps.config.outputs.enabled == 'true'
        env:
          TIDEN_API_TOKEN: ${{ secrets.TIDEN_API_TOKEN }}
          TIDEN_PRODUCT_ID: ${{ vars.TIDEN_PRODUCT_ID }}
          TIDEN_WORKSPACE_ID: ${{ vars.TIDEN_WORKSPACE_ID }}
          TIDEN_BASE_URL: https://app.tiden.ai
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/tiden_drift.py --cli "$RUNNER_TEMP/tiden-bin/tiden" --sync-repository "$GITHUB_REPOSITORY"
