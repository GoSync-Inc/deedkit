name: Production release record
# Run by the release owner after a successful `production.py apply`
# (docs/operations/production.md). It changes nothing on the server.
on:
  workflow_dispatch:
    inputs:
      sha:
        description: 'Exact 40-character main commit that production.py apply promoted'
        type: string
        required: true
      environment:
        description: 'Tiden release environment'
        type: choice
        options: [production]
        default: production
      released_at:
        description: 'Apply completion time, RFC3339 UTC (YYYY-MM-DDTHH:MM:SSZ)'
        type: string
        required: true
permissions:
  contents: read
  actions: read  # production.py verify reads the main push CI run and its jobs
concurrency:
  group: production-release
  cancel-in-progress: false
jobs:
  record:
    name: Record production release
    # Only the reviewed workflow and tools on main may use the Tiden credential.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      # Expression comparisons ignore case; this one does not, and runs before any repository code.
      - name: Require the main branch exactly
        env:
          REF: ${{ github.ref }}
        run: test "$REF" = refs/heads/main
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - name: Require the current main commit and its green push CI
        id: verify
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ inputs.sha }}
        run: |
          python scripts/production.py verify --sha "$SHA" > "$RUNNER_TEMP/verify.json"
          python -c 'import json, sys; print("url=" + json.load(open(sys.argv[1]))["url"])' "$RUNNER_TEMP/verify.json" >> "$GITHUB_OUTPUT"
      - name: Install pinned Tiden CLI with integrity check
        run: |
          pin="$GITHUB_WORKSPACE/docs/harness/tiden.md"
          ver=$(sed -n 's/^TIDEN_CLI_VERSION=//p' "$pin" | head -n 1)
          sum=$(sed -n 's/^TIDEN_CLI_SHA256_linux_amd64=//p' "$pin" | head -n 1)
          [ -n "$ver" ] && [ -n "$sum" ] || { echo "no Tiden pin in $pin" >&2; exit 1; }
          curl --fail --silent --show-error --location -o "$RUNNER_TEMP/tiden.tar.gz" \
            "https://github.com/qase-tms/homebrew-tap/releases/download/v$ver/tiden_linux_amd64.tar.gz"
          echo "$sum  $RUNNER_TEMP/tiden.tar.gz" | sha256sum --check --strict
          mkdir "$RUNNER_TEMP/tiden-bin"
          tar -xzf "$RUNNER_TEMP/tiden.tar.gz" -C "$RUNNER_TEMP/tiden-bin"
          echo "$RUNNER_TEMP/tiden-bin" >> "$GITHUB_PATH"
      - name: Record the production release in Tiden
        id: record
        env:
          TIDEN_API_TOKEN: ${{ secrets.TIDEN_API_TOKEN }}
          TIDEN_PRODUCT_ID: ${{ vars.TIDEN_PRODUCT_ID }}
          TIDEN_WORKSPACE_ID: ${{ vars.TIDEN_WORKSPACE_ID }}
          TIDEN_BASE_URL: https://app.tiden.ai
          SHA: ${{ inputs.sha }}
          RUN_URL: ${{ steps.verify.outputs.url }}
          RELEASED_AT: ${{ inputs.released_at }}
          ENVIRONMENT: ${{ inputs.environment }}
        run: |
          mkdir "$RUNNER_TEMP/release"
          python scripts/tiden_ci.py release --directory "$RUNNER_TEMP/release" --environment "$ENVIRONMENT" \
            --sha "$SHA" --url "$RUN_URL" --released-at "$RELEASED_AT"
      # Advisory (ANYM-540): errors arrive after a release goes live, so it lists the previous production release's
      # first-seen issues, as a projection only (TIDEN-CI.md, Environments). It never changes the record.
      - name: List the issues first seen in the previous production release
        if: steps.record.outcome == 'success' && inputs.environment == 'production'
        continue-on-error: true
        timeout-minutes: 1
        env:
          TIDEN_API_TOKEN: ${{ secrets.TIDEN_API_TOKEN }}
          TIDEN_PRODUCT_ID: ${{ vars.TIDEN_PRODUCT_ID }}
          TIDEN_WORKSPACE_ID: ${{ vars.TIDEN_WORKSPACE_ID }}
          TIDEN_BASE_URL: https://app.tiden.ai
          RELEASED_AT: ${{ inputs.released_at }}
        run: |
          python scripts/tiden_ci.py release-issues --directory "$RUNNER_TEMP/release" --environment production \
            --released-at "$RELEASED_AT"
      - name: Retain the release receipt
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: tiden-release-receipt
          path: ${{ runner.temp }}/release/tiden-*.json
          if-no-files-found: warn
          retention-days: 90
