name: Merge keeper
# Report mode (docs/operations/parallel-development.md, Merge keeper): the keeper's decisions for every open `ship`
# pull request go to the job summary, and nothing is written to GitHub. The acting keeper is the Mac mini's launchd
# job, because an enqueue with this GITHUB_TOKEN starts no merge_group run and would stall the queue for its 60-min
# check timeout. The hourly run fails when the mini's heartbeat (repository variable MERGE_KEEPER_HEARTBEAT) is older
# than 20 minutes, so a dead mini shows up as a red run. Undo: disable this workflow (gh workflow disable).
on:
  schedule:
    - cron: '*/5 * * * *'
    - cron: '17 * * * *'
  pull_request_review:
    types: [submitted]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: merge-keeper
  cancel-in-progress: false
jobs:
  report:
    name: Merge keeper report
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read  # checkout of main's keeper script
      pull-requests: read  # open pull requests, reviews, comments, queue state
      checks: read  # required check runs on each head
      actions: read  # failed jobs of a dequeued group run
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
          ref: main  # main's script, also on a pull_request_review run
      - name: Decide for every open ship pull request (writes nothing)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -o pipefail
          python3 -I scripts/merge_keeper.py run --dry-run --host github-actions | tee report.json
          { echo '```json'; cat report.json; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - name: The mini's keeper ran cleanly within 20 minutes
        if: ${{ always() && github.event.schedule == '17 * * * *' }}
        env:
          HEARTBEAT: ${{ vars.MERGE_KEEPER_HEARTBEAT }}
        run: python3 -I scripts/merge_keeper.py heartbeat-check --value "$HEARTBEAT"
