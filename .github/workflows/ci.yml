name: CI
on:
  # Feature branches are verified by their pull request run; pushing them again
  # would duplicate CI and publish evidence to a second, same-named Tiden branch.
  push:
    branches: [main]
  # A draft's pushes run only the tests their change reaches (D36, checks.yml `affected`); marking it ready starts
  # the full run that its merge needs, so `ready_for_review` joins the default types.
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  # The merge queue needs the required checks on its group commit; such a run
  # publishes nothing to Tiden (TIDEN-CI.md).
  merge_group:
  workflow_dispatch:
    inputs:
      source_ref:
        description: 'Optional exact source revision for a baseline verification'
        type: string
        default: ''
      tiden_branch:
        description: 'Explicit existing Tiden branch for baseline verification'
        type: string
        default: ''
permissions:
  contents: read
concurrency:
  # Each merge queue run has a group of its own and cancels nothing; a superseded
  # group run finishes and the queue ignores it. Each main push run also has its
  # own group, so every merged SHA keeps a complete result for promotion and
  # Tiden. Pull request and dispatch runs keep their groups.
  group: ci-${{ github.event_name == 'merge_group' && format('merge-queue-{0}', github.run_id) || github.event_name == 'push' && format('main-push-{0}', github.run_id) || github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name != 'merge_group' && github.event_name != 'push' }}
jobs:
  added_list:
    # ANYM-578: the exclusion inventory of this event, computed once: the files that autoloop pull requests (head
    # branch `autoloop-*` here) add to test directories, and every added test file, each against its merge base; a
    # merge queue group reads its pull requests from the queue. Other events exclude nothing. An unreadable pull
    # request, base or queue fails this job, and so every job that needs the inventory and CI gate.
    name: Added tests of autoloop pull requests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read  # checkout of this commit's script and the comparisons of each pull request head
      pull-requests: read  # the merge queue entries and their pull requests
    outputs:
      inventory: ${{ steps.list.outputs.inventory }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
      - name: List the added tests this event excludes from the required suites
        id: list
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/added_tests.py list
  reuse:
    # A main push of a commit the merge queue verified reuses that run's verification instead of testing the
    # commit again; production.py verify accepts it by the same queue rules (ANYM-321, ANYM-322, TIDEN-CI.md).
    # When the queue run itself reused a full pull request run of exactly this tree (ANYM-358), the push reuses that
    # pull request run's evidence after checking that its tested tree is exactly this commit's (the PR→queue chain).
    # Any doubt before the choice runs the full suite; pinned queue evidence that fails validation fails the run.
    name: Reuse the merge queue verification
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read  # checkout of this commit's decision script
      actions: read  # read the queue run of this commit and download its evidence artifact
    outputs:
      decision: ${{ steps.decide.outcome == 'success' && steps.decide.outputs.decision || 'full' }}
      validated_sha: ${{ steps.adopt.outputs.validated_sha }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
      - name: Choose reuse only for a passed queue run of this commit, or the pull request run it reused, with one current evidence artifact
        id: decide
        # A hung lookup ends here as a full verification, well inside the job timeout.
        continue-on-error: true
        timeout-minutes: 8
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/ci_reuse.py decide
      - name: Validate the pinned queue or pull request evidence of this commit
        id: adopt
        if: steps.decide.outcome == 'success' && steps.decide.outputs.decision == 'reuse'
        env:
          GH_TOKEN: ${{ github.token }}
          QUEUE_RUN_ID: ${{ steps.decide.outputs.run_id }}
          QUEUE_RUN_ATTEMPT: ${{ steps.decide.outputs.run_attempt }}
          QUEUE_ARTIFACT_ID: ${{ steps.decide.outputs.artifact_id }}
          QUEUE_ARTIFACT_DIGEST: ${{ steps.decide.outputs.artifact_digest }}
          # Set only for the PR→queue chain: the pull request whose run's evidence is adopted.
          QUEUE_PULL_REQUEST: ${{ steps.decide.outputs.pull_request }}
        run: python3 scripts/ci_reuse.py adopt --directory "$RUNNER_TEMP/ci-evidence"
      - name: Publish the validated evidence as this run's evidence
        if: steps.adopt.outcome == 'success'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ci-evidence
          path: ${{ runner.temp }}/ci-evidence
          if-no-files-found: error
          retention-days: 14
          overwrite: true
  pr_reuse:
    # A merge queue group whose commit has exactly the tree a passing, full pull request run tested reuses that
    # run's verification instead of testing the same code again (owner decision 2026-10-18). The decision downloads
    # and validates that run's evidence as data; any doubt runs the full suite and never fails the run. The main
    # push of such a group reuses the same pull request run's evidence by the chain rules of the `reuse` job.
    name: Reuse the pull request verification
    needs: added_list
    if: github.event_name == 'merge_group'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read  # checkout of this commit's decision script
      actions: read  # read the pull request's runs and download its evidence artifact
    outputs:
      decision: ${{ steps.decide.outcome == 'success' && steps.decide.outputs.decision || 'full' }}
      validated_sha: ${{ steps.decide.outcome == 'success' && steps.decide.outputs.validated_sha || '' }}
      producer_url: ${{ steps.decide.outcome == 'success' && steps.decide.outputs.producer_url || '' }}
      tested_sha: ${{ steps.decide.outcome == 'success' && steps.decide.outputs.tested_sha || '' }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
      - name: Choose reuse only for a passed full pull request run of exactly this tree
        id: decide
        # A hung lookup ends here as a full verification, well inside the job timeout.
        continue-on-error: true
        timeout-minutes: 6
        env:
          GH_TOKEN: ${{ github.token }}
          # The group's own inventory: a pull request run is reused only when it excluded exactly these files.
          ADDED_TESTS: ${{ needs.added_list.outputs.inventory }}
        run: python3 scripts/ci_reuse.py group
      - name: Reused pull request run ${{ steps.decide.outputs.run_id }} attempt ${{ steps.decide.outputs.run_attempt }}
        # This step's name in the run's jobs names the decision's producer: promotion and the main push follow the
        # chain to that run only, and refuse it when the step is absent or the run is gone (production.py queue_chain).
        if: steps.decide.outcome == 'success' && steps.decide.outputs.decision == 'reuse'
        run: 'true'
  checks:
    # After the decisions: a validated reuse skips the test jobs (on a main push it publishes the queue's evidence);
    # every other run verifies in full. A reuse that failed validation leaves checks skipped, so the gate fails.
    needs: [added_list, reuse, pr_reuse]
    if: ${{ !cancelled() && (needs.reuse.outputs.decision != 'reuse' || needs.reuse.result == 'success') }}
    uses: ./.github/workflows/checks.yml
    with:
      source_ref: ${{ inputs.source_ref || '' }}
      tiden_branch: ${{ inputs.tiden_branch || '' }}
      reuse_queue_evidence: ${{ needs.reuse.outputs.decision == 'reuse' }}
      reuse_pr_verification: ${{ needs.pr_reuse.outputs.decision == 'reuse' }}
      reused_pr_run: ${{ needs.pr_reuse.outputs.producer_url }}
      reused_pr_tested_sha: ${{ needs.pr_reuse.outputs.tested_sha }}
      added_tests: ${{ needs.added_list.outputs.inventory }}
    secrets:
      # A queued group can hold a fork's unmerged code, so it never gets the credential.
      TIDEN_API_TOKEN: ${{ github.event_name != 'merge_group' && secrets.TIDEN_API_TOKEN || '' }}
  native:
    # A merge queue group that reuses a pull request run skips this job too: that run's CI gate required it on exactly
    # this tree. Every other run, and any doubt, runs it; the main push always does (production.py REQUIRED_JOBS).
    # It also needs the event's exclusion inventory (ANYM-578); without one its strip step fails closed.
    needs: [added_list, pr_reuse]
    if: ${{ !cancelled() && needs.pr_reuse.outputs.decision != 'reuse' }}
    uses: ./.github/workflows/whatsmeow.yml
    with:
      source_ref: ${{ inputs.source_ref || '' }}
      added_tests: ${{ needs.added_list.outputs.inventory }}
  images:
    uses: ./.github/workflows/images.yml
    with:
      source_ref: ${{ inputs.source_ref || '' }}
  gate:
    name: CI gate
    needs: [added_list, reuse, pr_reuse, checks, native, images]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Require every verification job
        env:
          ADDED_LIST_RESULT: ${{ needs.added_list.result }}
          CHECKS_RESULT: ${{ needs.checks.result }}
          NATIVE_RESULT: ${{ needs.native.result }}
          IMAGES_RESULT: ${{ needs.images.result }}
          PR_DECISION: ${{ needs.pr_reuse.outputs.decision }}
          SOURCE_REF: ${{ inputs.source_ref || '' }}
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          test "$ADDED_LIST_RESULT" = success
          test "$CHECKS_RESULT" = success
          # native / synthetic is skipped only with the pull request reuse, which the next step validates. An if, not
          # an `&&` list: `bash -e` ignores a failure on the left of `&&`.
          if [ "$NATIVE_RESULT" = skipped ]; then
            test "$PR_DECISION" = reuse
          else
            test "$NATIVE_RESULT" = success
          fi
          test "$IMAGES_RESULT" = success
          # A manual baseline of another revision must never turn this commit green.
          test -z "$SOURCE_REF" || test "$SOURCE_REF" = "$EXPECTED_SHA"
      - name: Require this commit's own verification, a validated reuse of an earlier one or a docs-only decision
        env:
          DECISION: ${{ needs.reuse.outputs.decision }}
          REUSE_RESULT: ${{ needs.reuse.result }}
          REUSED_SHA: ${{ needs.reuse.outputs.validated_sha }}
          PR_DECISION: ${{ needs.pr_reuse.outputs.decision }}
          PR_REUSE_RESULT: ${{ needs.pr_reuse.result }}
          PR_REUSED_SHA: ${{ needs.pr_reuse.outputs.validated_sha }}
          VERIFIED_SHA: ${{ needs.checks.outputs.source_sha }}
          DOCS_ONLY: ${{ needs.checks.outputs.docs_only }}
          DOCS_SHA: ${{ needs.checks.outputs.docs_sha }}
          AFFECTED: ${{ needs.checks.outputs.affected }}
          AFFECTED_SHA: ${{ needs.checks.outputs.affected_sha }}
          DRAFT: ${{ github.event.pull_request.draft }}
          EVENT_NAME: ${{ github.event_name }}
          REF: ${{ github.ref }}
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          if [ "$DECISION" = reuse ]; then
            # checks / verify was skipped by the reuse decision: only the validated queue evidence of this commit counts.
            test "$EVENT_NAME" = push
            test "$REF" = refs/heads/main
            test "$REUSE_RESULT" = success
            test "$REUSED_SHA" = "$EXPECTED_SHA"
            test -z "$VERIFIED_SHA"
          elif [ "$PR_DECISION" = reuse ]; then
            # checks / verify was skipped by the decision that a passing pull request run tested this group's tree.
            test "$EVENT_NAME" = merge_group
            test "$PR_REUSE_RESULT" = success
            test "$PR_REUSED_SHA" = "$EXPECTED_SHA"
            test -z "$VERIFIED_SHA"
          elif [ "$DOCS_ONLY" = true ]; then
            # checks / verify was skipped by the docs-only decision on this pull request's merge commit or this
            # merge queue group commit (ANYM-323); a main push never takes it.
            [ "$EVENT_NAME" = pull_request ] || [ "$EVENT_NAME" = merge_group ]
            test "$DOCS_SHA" = "$EXPECTED_SHA"
            test -z "$VERIFIED_SHA"
          elif [ "$AFFECTED" = true ]; then
            # checks / verify was skipped for the affected-only run of a draft pull request (D36): only its own
            # `affected` job's pass on this merge commit counts, and never for a ready pull request, the queue or main.
            test "$EVENT_NAME" = pull_request
            test "$DRAFT" = true
            test "$AFFECTED_SHA" = "$EXPECTED_SHA"
            test -z "$VERIFIED_SHA"
          else
            # Otherwise checks / verify tested this commit; one skipped for any other reason fails the gate.
            test -n "$VERIFIED_SHA"
            test "$VERIFIED_SHA" = "$EXPECTED_SHA"
          fi
  publish:
    # The only job with write permissions, and only on a main push after every verification
    # passed. It ships the images `images / build (<target>)` tested, never a rebuild, and a
    # tag that already exists is never moved (scripts/publish_images.py, production.md). A new
    # image is pushed under a staging tag and gets its final `<sha>` tag only after its
    # attestation verifies, so a failed attestation leaves nothing a full rerun refuses (ANYM-602).
    name: publish
    needs: [gate]
    # Explicit result checks: a push run has skipped ancestors (pr_reuse, reused test jobs), and
    # the implicit success() would skip publish whenever any ancestor was skipped.
    if: ${{ !cancelled() && needs.gate.result == 'success' && github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    # Two runs of one commit (a rerun, or main reset to an earlier commit while its run is
    # active) must not both find a tag absent and push; the lookup-to-confirm sequence is
    # serialized per commit. A running publication is never cancelled; GitHub keeps at most
    # one more waiting and cancels an older waiting one, which then fails its run.
    concurrency:
      group: publish-images-${{ github.sha }}
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read  # checkout of this commit's publication script
      packages: write  # push ghcr.io/gosync-inc/deedkit-<target>:<sha> and its attestation bundle
      id-token: write  # Sigstore signing certificate for the provenance attestation
      attestations: write  # store the attestation in this repository's attestation API
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: image-*
          path: ${{ runner.temp }}/images
      - name: Log in to GHCR with the job token
        env:
          GH_TOKEN: ${{ github.token }}
          ACTOR: ${{ github.actor }}
        run: printf '%s' "$GH_TOKEN" | docker login ghcr.io --username "$ACTOR" --password-stdin
      - name: Push each tested image to a staging tag unless its final tag already exists
        id: publish
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.sha }}
        run: python3 scripts/publish_images.py publish --sha "$SHA" --attempt "$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" --directory "$RUNNER_TEMP/images"
      - name: Attest runtime
        if: steps.publish.outputs.attest_runtime == 'true'
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ghcr.io/gosync-inc/deedkit-runtime
          subject-digest: ${{ steps.publish.outputs.digest_runtime }}
          push-to-registry: true
          create-storage-record: false
      - name: Attest indexer
        if: steps.publish.outputs.attest_indexer == 'true'
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ghcr.io/gosync-inc/deedkit-indexer
          subject-digest: ${{ steps.publish.outputs.digest_indexer }}
          push-to-registry: true
          create-storage-record: false
      - name: Attest enricher-local
        if: steps.publish.outputs.attest_enricher_local == 'true'
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ghcr.io/gosync-inc/deedkit-enricher-local
          subject-digest: ${{ steps.publish.outputs.digest_enricher_local }}
          push-to-registry: true
          create-storage-record: false
      - name: Attest whatsapp-native
        if: steps.publish.outputs.attest_whatsapp_native == 'true'
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ghcr.io/gosync-inc/deedkit-whatsapp-native
          subject-digest: ${{ steps.publish.outputs.digest_whatsapp_native }}
          push-to-registry: true
          create-storage-record: false
      - name: Attest gateway
        if: steps.publish.outputs.attest_gateway == 'true'
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ghcr.io/gosync-inc/deedkit-gateway
          subject-digest: ${{ steps.publish.outputs.digest_gateway }}
          push-to-registry: true
          create-storage-record: false
      - name: Attest calendar
        if: steps.publish.outputs.attest_calendar == 'true'
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ghcr.io/gosync-inc/deedkit-calendar
          subject-digest: ${{ steps.publish.outputs.digest_calendar }}
          push-to-registry: true
          create-storage-record: false
      - name: Attest calls
        if: steps.publish.outputs.attest_calls == 'true'
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ghcr.io/gosync-inc/deedkit-calls
          subject-digest: ${{ steps.publish.outputs.digest_calls }}
          push-to-registry: true
          create-storage-record: false
      - name: Attest backup
        if: steps.publish.outputs.attest_backup == 'true'
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ghcr.io/gosync-inc/deedkit-backup
          subject-digest: ${{ steps.publish.outputs.digest_backup }}
          push-to-registry: true
          create-storage-record: false
      - name: Tag each staged image as final once its attestation verifies
        env:
          GH_TOKEN: ${{ github.token }}
          ACTOR: ${{ github.actor }}
          SHA: ${{ github.sha }}
        run: python3 scripts/publish_images.py promote --sha "$SHA" --attempt "$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
      - name: Require every image to be published with a valid attestation
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.sha }}
        run: python3 scripts/publish_images.py confirm --sha "$SHA" --attempt "$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
      - name: Log out of GHCR
        if: ${{ always() }}
        run: docker logout ghcr.io
  release:
    # Runs after every verification job and the image publication passed, so no release is
    # recorded for a SHA whose images were not published. Tiden captures a release gate from the
    # main gate when the release is first created (TIDEN-CI.md), so a commit whose evidence
    # publication was not verified records nothing and warns.
    # Temporary (ANYM-411, end condition in TIDEN-CI.md): an unavailable Tiden (CLI download, a failed, unparseable
    # or hung call) only warns with a receipt. Every step has a timeout and together they stay below the job's,
    # so the warning and the receipt upload always run.
    name: Tiden release record
    needs: [gate, publish, checks]
    if: ${{ !cancelled() && needs.gate.result == 'success' && needs.publish.result == 'success' && github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check optional Tiden configuration
        id: config
        timeout-minutes: 1
        env:
          TIDEN_API_TOKEN: ${{ secrets.TIDEN_API_TOKEN }}
          TIDEN_PRODUCT_ID: ${{ vars.TIDEN_PRODUCT_ID }}
          TIDEN_WORKSPACE_ID: ${{ vars.TIDEN_WORKSPACE_ID }}
          TIDEN_PUBLISHED: ${{ needs.checks.outputs.tiden_published }}
        run: |
          if [ -z "$TIDEN_API_TOKEN" ]; then
            echo 'enabled=false' >> "$GITHUB_OUTPUT"
            echo 'Tiden reporting is not configured; see TIDEN-CI.md.' >> "$GITHUB_STEP_SUMMARY"
          else
            # Two commands: `bash -e` ignores a failure on the left of `&&`.
            test -n "$TIDEN_PRODUCT_ID"
            test -n "$TIDEN_WORKSPACE_ID"
            if [ "$TIDEN_PUBLISHED" = true ]; then
              echo 'enabled=true' >> "$GITHUB_OUTPUT"
            else
              # Tiden may hold no run, a partial one or an unverified completed one for this commit.
              echo 'enabled=false' >> "$GITHUB_OUTPUT"
              echo '::warning title=Tiden release not recorded::the evidence publication of this commit was not verified; rerun all jobs to publish and record it (TIDEN-CI.md)'
            fi
          fi
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        if: steps.config.outputs.enabled == 'true'
        timeout-minutes: 2
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        if: steps.config.outputs.enabled == 'true'
        timeout-minutes: 3
        with:
          name: ci-evidence
          path: ${{ runner.temp }}/ci-evidence
      # Only the download may fail without failing the job; the checksum and extraction below may not.
      - name: Download pinned Tiden CLI
        id: download
        if: steps.config.outputs.enabled == 'true'
        continue-on-error: true
        timeout-minutes: 2
        run: |
          pin="$GITHUB_WORKSPACE/docs/harness/tiden.md"
          ver=$(sed -n 's/^TIDEN_CLI_VERSION=\([0-9][0-9]*\.[0-9][0-9]*\.[0-9][0-9]*\)$/\1/p' "$pin" | head -n 1)
          sum=$(sed -n 's/^TIDEN_CLI_SHA256_linux_amd64=\([0-9a-f]\{64\}\)$/\1/p' "$pin" | head -n 1)
          [ -n "$ver" ] && [ -n "$sum" ] || { echo "no valid Tiden pin in $pin" >&2; exit 1; }
          curl --fail --silent --show-error --location -o "$RUNNER_TEMP/tiden.tar.gz" \
            "https://github.com/qase-tms/homebrew-tap/releases/download/v$ver/tiden_linux_amd64.tar.gz"
      - name: Install pinned Tiden CLI with integrity check
        if: steps.config.outputs.enabled == 'true' && steps.download.outcome == 'success'
        timeout-minutes: 1
        run: |
          pin="$GITHUB_WORKSPACE/docs/harness/tiden.md"
          ver=$(sed -n 's/^TIDEN_CLI_VERSION=\([0-9][0-9]*\.[0-9][0-9]*\.[0-9][0-9]*\)$/\1/p' "$pin" | head -n 1)
          sum=$(sed -n 's/^TIDEN_CLI_SHA256_linux_amd64=\([0-9a-f]\{64\}\)$/\1/p' "$pin" | head -n 1)
          [ -n "$ver" ] && [ -n "$sum" ] || { echo "no valid Tiden pin in $pin" >&2; exit 1; }
          echo "$sum  $RUNNER_TEMP/tiden.tar.gz" | sha256sum --check --strict
          mkdir "$RUNNER_TEMP/tiden-bin"
          tar -xzf "$RUNNER_TEMP/tiden.tar.gz" -C "$RUNNER_TEMP/tiden-bin"
          echo "$RUNNER_TEMP/tiden-bin" >> "$GITHUB_PATH"
      - name: Warn that the Tiden CLI was not downloaded
        if: steps.config.outputs.enabled == 'true' && steps.download.outcome != 'success'
        timeout-minutes: 1
        env:
          DOWNLOAD: ${{ steps.download.outcome }}
          SHA: ${{ github.sha }}
        run: |
          python3 -c 'import json, os, pathlib; d = pathlib.Path(os.environ["RUNNER_TEMP"], "ci-evidence"); d.mkdir(parents=True, exist_ok=True); (d / "tiden-release-receipt.json").write_text(json.dumps({"state": "not_attempted", "version": "deedkit@" + os.environ["SHA"], "environment": "github-actions-synthetic", "download": os.environ["DOWNLOAD"]}, indent=2))'
          echo "::warning title=Tiden release not recorded::the Tiden CLI download ended ${DOWNLOAD:-not run} (receipt state not_attempted); for now a Tiden error in the CI release record only warns (ANYM-411, TIDEN-CI.md)"
      - name: Record the main release in Tiden
        if: steps.config.outputs.enabled == 'true' && steps.download.outcome == 'success'
        # scripts/tiden_ci.py CI_RELEASE_DEADLINE ends its own work at least 30 seconds before this.
        timeout-minutes: 5
        env:
          TIDEN_API_TOKEN: ${{ secrets.TIDEN_API_TOKEN }}
          TIDEN_PRODUCT_ID: ${{ vars.TIDEN_PRODUCT_ID }}
          TIDEN_WORKSPACE_ID: ${{ vars.TIDEN_WORKSPACE_ID }}
          TIDEN_BASE_URL: https://app.tiden.ai
        run: python scripts/tiden_ci.py release --directory "$RUNNER_TEMP/ci-evidence" --environment github-actions-synthetic
      - name: Retain the release receipt
        if: ${{ always() && steps.config.outputs.enabled == 'true' }}
        timeout-minutes: 3
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: tiden-release-receipt
          path: ${{ runner.temp }}/ci-evidence/tiden-release*.json
          if-no-files-found: warn
          retention-days: 14
