name: Native WhatsApp adapter
on:
  workflow_call:
    inputs:
      source_ref:
        type: string
        default: ''
  workflow_dispatch:
permissions:
  contents: read
jobs:
  synthetic:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
          ref: ${{ inputs.source_ref || '' }}
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: '1.26.9'
          cache-dependency-path: whatsapp/whatsmeow/go.sum
      - name: Check the whatsmeow fork against upstream and fork.patch
        run: python3 scripts/check_whatsmeow_fork.py
      - name: Test durable capture, operations and offline contracts
        working-directory: whatsapp/whatsmeow
        run: |
          go test -race -count=1 -json ./... > "$RUNNER_TEMP/whatsmeow-tests.json"
          go test -race -count=1 -run '^TestFork' go.mau.fi/whatsmeow
          go vet ./...
          CGO_ENABLED=0 go build -trimpath -o "$RUNNER_TEMP/anymsg-whatsmeow" .
          go version -m "$RUNNER_TEMP/anymsg-whatsmeow" > "$RUNNER_TEMP/whatsmeow-build.txt"
      - name: Retain actual test and build evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: whatsmeow-synthetic-evidence
          path: |
            ${{ runner.temp }}/whatsmeow-tests.json
            ${{ runner.temp }}/whatsmeow-build.txt
          retention-days: 14
