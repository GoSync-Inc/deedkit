name: Tiden sync
# The run title names the commit the run processes, so Tiden health can find the sync of its TARGET (ANYM-438).
# A ready merge (TIDEN-CI.md, Ready merge) is titled by its branch, which never equals a commit.
run-name: Tiden sync ${{ github.event.workflow_run.head_sha || inputs.sha || format('ready merge {0}', inputs.branch) }}
on:
  # Sync B (ANYM-405, TIDEN-CI.md): after the CI run of every main push, write the merged pull request's Tiden
  # bookkeeping to Tiden main. A workflow of its own, so a red or dropped sync never touches the `CI` push run that
  # production promotion requires; it is not a required check and blocks no merge or release.
  workflow_run:  # zizmor: ignore[dangerous-triggers] only main pushes pass the guards; it checks out main, not the upstream head
    workflows: [CI]
    types: [completed]
  # A hand rerun for one main commit, for example a waiting run that GitHub dropped, or the ready merge of one
  # proposal or review branch of ready cards (harness tiden.md, Ready merge). A dispatch names exactly one of them.
  workflow_dispatch:
    inputs:
      sha:
        description: 'The exact main commit to sync'
        type: string
        required: false
      branch:
        description: 'A proposal/ or review/ branch of ready cards to merge to Tiden main (instead of sha)'
        type: string
        required: false
permissions:
  contents: read
concurrency:
  # The sync is the only automated writer of anchors and replaces whole source lists, so runs never overlap and a
  # run in progress is never cancelled. GitHub keeps one waiting run and drops an older waiting one; a later run does
  # not cover an earlier commit, so a dropped run is dispatched again with its own SHA (TIDEN-CI.md).
  group: tiden-sync
  cancel-in-progress: false
jobs:
  sync:
    name: Tiden sync
    # Only the reviewed workflow and tools on main may use the Tiden credential, and only after a main push run,
    # whatever its conclusion: the merged code needs its bookkeeping even when a later CI job failed. If the
    # publication left a newly added marked test without an imported case, the sync fails at step `links`; its
    # success does not verify the push run's publication, which its own receipt records (TIDEN-CI.md).
    # `contents: read` covers the pull request read (gh api repos/<repo>/pulls/<n>), so the job needs nothing more.
    if: >-
      github.ref == 'refs/heads/main' && (github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.event == 'push' && github.event.workflow_run.head_branch == 'main'))
    runs-on: ubuntu-latest
    # The sync's CLI and gh calls time out after 120 seconds each; a long merge with many tests stays well inside.
    timeout-minutes: 30
    steps:
      # Expression comparisons ignore case; these do not, and run before any repository code.
      - name: Require the main branch and an exact commit
        env:
          REF: ${{ github.ref }}
          EVENT: ${{ github.event_name }}
          UPSTREAM_EVENT: ${{ github.event.workflow_run.event }}
          UPSTREAM_BRANCH: ${{ github.event.workflow_run.head_branch }}
          UPSTREAM_REPOSITORY: ${{ github.event.workflow_run.head_repository.full_name }}
          REPOSITORY: ${{ github.repository }}
          UPSTREAM_SHA: ${{ github.event.workflow_run.head_sha }}
          INPUT_SHA: ${{ inputs.sha }}
          INPUT_BRANCH: ${{ inputs.branch }}
        run: |
          test "$REF" = refs/heads/main
          if [ "$EVENT" = workflow_run ]; then
            test "$UPSTREAM_EVENT" = push
            test "$UPSTREAM_BRANCH" = main
            test "$UPSTREAM_REPOSITORY" = "$REPOSITORY"
            sha=$UPSTREAM_SHA
          else
            test "$EVENT" = workflow_dispatch
            if [ -n "$INPUT_BRANCH" ]; then
              test -z "$INPUT_SHA"
              [[ "$INPUT_BRANCH" =~ ^(proposal|review)/[a-z0-9]+([/_-][a-z0-9]+)*$ ]] || exit 1
              echo "branch=$INPUT_BRANCH" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            sha=$INPUT_SHA
          fi
          [[ "$sha" =~ ^[0-9a-f]{40}$ ]] || exit 1
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
        id: guard
      # main as it is when the run starts, never the commit's own tree: the tools that hold the credential are
      # main's. The commit must be on that history.
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
          ref: main
          fetch-depth: 0
      - name: Require the commit on main
        if: steps.guard.outputs.sha != ''
        env:
          SHA: ${{ steps.guard.outputs.sha }}
        run: git merge-base --is-ancestor "$SHA" HEAD
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with: {python-version: '3.13'}
      # The sync calls the CLI by its path; a workflow_run job writes nothing to GITHUB_PATH or GITHUB_ENV.
      - name: Install pinned Tiden CLI with integrity check
        run: |
          curl --fail --silent --show-error --location https://github.com/qase-tms/homebrew-tap/releases/download/v0.41.0/tiden_linux_amd64.tar.gz -o "$RUNNER_TEMP/tiden.tar.gz"
          echo "d42fca58f868dc22be1aa01187105a1c442b4a32c88e9c47ac2f051ef05fb286  $RUNNER_TEMP/tiden.tar.gz" | sha256sum --check
          mkdir "$RUNNER_TEMP/tiden-bin"
          tar -xzf "$RUNNER_TEMP/tiden.tar.gz" -C "$RUNNER_TEMP/tiden-bin"
      # It writes since check A ran green on three pull requests (#136, #137, #138; ANYM-405). Without
      # TIDEN_API_TOKEN the sync fails, so a missing credential is never green. A ready merge passes its branch and
      # an empty SHA; the script then merges that branch alone.
      - name: Merge the named branch, link the marked tests, anchor the files and set the status
        env:
          TIDEN_API_TOKEN: ${{ secrets.TIDEN_API_TOKEN }}
          TIDEN_PRODUCT_ID: ${{ vars.TIDEN_PRODUCT_ID }}
          TIDEN_WORKSPACE_ID: ${{ vars.TIDEN_WORKSPACE_ID }}
          TIDEN_BASE_URL: https://app.tiden.ai
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ steps.guard.outputs.sha }}
          BRANCH: ${{ steps.guard.outputs.branch }}
        run: python scripts/tiden_sync.py --sha "$SHA" --ready-branch "$BRANCH" --cli "$RUNNER_TEMP/tiden-bin/tiden"
