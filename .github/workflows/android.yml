name: Android service

on:
  pull_request:
    paths:
      - 'services/android/**'
      - 'services/gateway/**'
      - '.github/workflows/android.yml'
  push:
    branches: [main]
    paths:
      - 'services/android/**'
      - 'services/gateway/**'
      - '.github/workflows/android.yml'

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.13'
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          version: '0.9.26'
      - name: Service tests and installable package
        working-directory: services/android
        run: |
          uv sync --locked --group dev
          uv run ruff check src tests
          uv run pytest -q
          uv build --out-dir "$RUNNER_TEMP/android-dist"
          uv venv "$RUNNER_TEMP/android-installed" --python 3.13
          uv pip install --python "$RUNNER_TEMP/android-installed/bin/python" "$RUNNER_TEMP"/android-dist/*.whl
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/android-installed/bin/deedkit-android" --help
