name: Publish PyPI
on:
  workflow_dispatch:
    inputs:
      version:
        description: Version matching the selected vX.Y.Z tag
        required: true
        default: '0.9.18'
      verify_only:
        description: Check OIDC trust without publishing any package
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  tag:
    if: ${{ !inputs.verify_only }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with: {persist-credentials: false, fetch-depth: 0}
      - name: Require the version tag
        env: {VERSION: '${{ inputs.version }}', REF: '${{ github.ref }}', SHA: '${{ github.sha }}'}
        run: |
          test "$REF" = "refs/tags/v$VERSION"
          commit=$(git rev-parse --verify "refs/tags/v$VERSION^{commit}")
          test "$commit" = "$SHA"
          # Publish only a commit that already reached main through required CI.
          git merge-base --is-ancestor "$commit" refs/remotes/origin/main
  checks:
    needs: tag
    uses: ./.github/workflows/checks.yml # zizmor: ignore[self-repository] -- actionlint 1.7.12 does not support $/ workflow calls.
    with:
      version: ${{ inputs.version }}
      # A release tag tests everything: no autoloop pull request's added tests are excluded (ANYM-578).
      added_tests: '{"files": [], "provenance": []}'
  publish:
    needs: checks
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/anymsg/
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with: {name: python-dist, path: dist}
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
  verify-trust:
    if: ${{ inputs.verify_only && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with: {persist-credentials: false}
      - name: Verify publisher identity without uploading
        run: python3 scripts/verify_publisher_trust.py pypi
