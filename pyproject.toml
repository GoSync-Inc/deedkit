# Development facade only. Runtime packages retain independent environments.
[project]
name = "deedkit-workspace"
version = "0.1.0"
requires-python = ">=3.13,<3.14"
dependencies = ["anymsg"]
[dependency-groups]
dev = [
    "deedkit-platform-contracts",
    "hypothesis==6.170.5",
    "pytest==9.1.1",
    "pyyaml==6.0.3",
    "tiden-telemetry==0.1.0",
]
[tool.uv]
package = false
[tool.uv.sources]
anymsg = { path = "services/messaging", editable = true }
deedkit-platform-contracts = { path = "packages/platform-contracts", editable = true }

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q -p no:cacheprovider"

[tool.ruff.lint]
# Existing compact source style. Keep all default Pyflakes correctness rules enabled;
# fixture imports explicitly reexport their names so duplicate test definitions still fail F811.
ignore = ["E401", "E402", "E701", "E702", "E731"]
