[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "deedkit-recordings"
version = "0.1.0"
description = "Independent, permission-scoped wearable recording reads"
requires-python = ">=3.13,<3.14"
dependencies = [
  "mcp==2.3.0", "starlette==1.8.0",
  "pydantic>=2.12,<3", "uvicorn==0.54.0", "httpx==0.28.1", "httpx2==2.13.1",
]

[project.scripts]
deedkit-recordings = "deedkit_recordings.cli:main"

[dependency-groups]
dev = ["pytest==9.1.1", "ruff==0.15.7"]

[tool.hatch.build.targets.wheel]
packages = ["src/deedkit_recordings"]

[tool.ruff]
target-version = "py313"
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
