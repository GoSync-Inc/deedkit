[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "anymsg"
version = "0.9.19"
description = "A self-hosted messaging archive and MCP interface for agents"
readme = "README.md"
requires-python = ">=3.13,<3.14"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "GoSync"}]
keywords = ["mcp", "telegram", "whatsapp", "messaging", "archive"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Programming Language :: Python :: 3.13",
  "Operating System :: POSIX",
  "Topic :: Communications :: Chat",
]
dependencies = [
  "mcp==2.3.0",
  "psycopg[binary,pool]==3.3.6",
  "uvicorn==0.54.0",
  "starlette==1.8.0",
  "httpx==0.28.1",
  "idna==3.20",
  "telethon==1.45.0",
  "markdown-it-py==4.2.0",
]

[project.urls]
Homepage = "https://github.com/GoSync-Inc/deedkit"
Repository = "https://github.com/GoSync-Inc/deedkit"
Issues = "https://github.com/GoSync-Inc/deedkit/issues"

[project.optional-dependencies]
telemetry = ["tiden-telemetry==0.1.0"]

[project.scripts]
anymsg = "anymsg.cli:main"

[dependency-groups]
dev = [
    "pytest==9.1.1",
    "pyyaml==6.0.3",
    "tiden-telemetry==0.1.0",
]

[tool.hatch.build.targets.wheel]
packages = ["anymsg", "messaging_service"]
exclude = [
  "**/node_modules/**", "**/__pycache__/**", "**/*.pyc", "**/.venv/**",
  "**/.local/**", "**/private/**", "**/sessions/**", "**/outputs/**",
  "**/*.dsn", "**/*.token", "**/auth.json", "**/credentials*.json", "**/*.session", "**/.env",
]

[tool.hatch.build.targets.sdist]
include = ["/anymsg", "/messaging_service", "/pyproject.toml", "/uv.lock", "/README.md", "/LICENSE", "/THIRD_PARTY_NOTICES.md", "/hatch_build.py", "/requirements*.lock", "/requirements*.in"]
exclude = ["**/__pycache__/**", "**/*.pyc", "**/.venv/**"]

[tool.hatch.build.hooks.custom]
path = "hatch_build.py"

[tool.pytest.ini_options]
testpaths = ["../../tests"]
addopts = "-q -p no:cacheprovider"

[tool.uv]
package = true
