[project]
name = "personal-os-voice-service"
version = "0.1.0"
description = "Task-based browser voice assistant with scoped AnyMsg context"
requires-python = ">=3.13,<3.14"
dependencies = [
  "pipecat-ai[google,webrtc,silero]==1.14.0",
  "fastapi==0.143.0",
  "uvicorn==0.54.0",
  "httpx==0.28.1",
  "mcp==2.3.0",
  "py-tgcalls==3.0.0",
  "ntgcalls==3.0.3",
  "telethon==1.45.0",
  "python-multipart>=0.0.20,<0.1",
  "phonenumbers==9.0.40",
]

[dependency-groups]
dev = ["pytest>=8,<10", "pytest-asyncio>=1,<2"]

[tool.pytest.ini_options]
pythonpath = ["."]
asyncio_mode = "auto"
testpaths = ["tests"]
