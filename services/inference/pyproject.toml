[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "deedkit-inference"
version = "0.1.0"
description = "Shared local inference service for the Mac mini: per-service keys, bounded queue, admission"
requires-python = ">=3.13,<3.14"
dependencies = [
  "fastapi==0.143.0", "starlette==1.8.0",
  "pydantic>=2.12,<3", "uvicorn==0.54.0", "python-multipart==0.0.33",
]

[project.scripts]
deedkit-inference = "deedkit_inference.cli:main"

[dependency-groups]
dev = ["pytest==9.1.1", "ruff==0.15.7"]

[tool.hatch.build.targets.wheel]
packages = ["src/deedkit_inference"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["error::pytest.PytestUnraisableExceptionWarning"]

[tool.ruff]
target-version = "py313"
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
