[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "family-calendar-service"
version = "0.2.0"
description = "Multi-account Google and iCloud family calendars with explicit roles and a unified MCP"
readme = "README.md"
requires-python = ">=3.13,<3.14"
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
  "httpx>=0.28,<0.29",
  "icalendar>=6,<8",
  "python-dateutil>=2.9,<3",
  "defusedxml>=0.7,<0.8",
  "cryptography>=50.0.0,<51",
  "psycopg[binary,pool]>=3.2,<4",
  "mcp==2.3.0",
  "google-auth>=2.40,<3",
  "google-auth-oauthlib>=1.2,<2",
  "google-api-python-client>=2.180,<3",
  "uvicorn==0.54.0",
  "recurring-ical-events>=3.6,<4",
  "starlette==1.8.0",
]

[project.scripts]
family-calendar = "family_calendar.cli:main"
family-calendar-local = "family_calendar.service.runtime:main"

[dependency-groups]
dev = [
    "pytest>=8,<10",
    "pytest-asyncio>=1,<2",
    "ruff>=0.12,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["family_calendar"]
exclude = ["**/.local/**", "**/outputs/**", "**/*.key", "**/*.sqlite*"]

[tool.hatch.build.targets.sdist]
include = ["family_calendar", "tests", "scripts", "docs", "AGENTS.md", "README.md", "CONTRACTS.md", "THIRD_PARTY.md", "LICENSE", "pyproject.toml", "uv.lock", ".gitignore", ".gitattributes"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q -m 'not live'"
markers = ["live: opt-in iCloud tests requiring owner configuration"]

[tool.ruff]
target-version = "py313"
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
