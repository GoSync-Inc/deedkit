[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "deedkit-agent-runner"
version = "0.1.0"
description = "Runs one Claude Code or Codex task per disposable container on the Mac mini's agent VM"
requires-python = ">=3.13,<3.14"
dependencies = [
  "fastapi==0.143.0", "starlette==1.8.0", "pydantic>=2.12,<3", "uvicorn==0.54.0",
]

[project.scripts]
agent-runner = "deedkit_agent_runner.cli:main"

[dependency-groups]
dev = ["pytest==9.1.1", "ruff==0.15.7", "httpx==0.28.1"]

[tool.hatch.build.targets.wheel]
packages = ["src/deedkit_agent_runner"]

[tool.hatch.build.targets.wheel.force-include]
"preamble.md" = "deedkit_agent_runner/preamble.md"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["docker: needs a Docker daemon (CI runs them; skipped where none is reachable)"]

[tool.ruff]
target-version = "py313"
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
